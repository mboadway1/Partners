plugins {
    id 'com.android.application'
}

android {
    namespace 'com.partners.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.partners.tv'
        minSdk 22
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Fixed key so new builds install over old ones without uninstalling.
    signingConfigs {
        debug {
            storeFile file('partners.keystore')
            storePassword 'partnerstv'
            keyAlias 'partnerstv'
            keyPassword 'partnerstv'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
