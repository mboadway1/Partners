<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Peggy">
<meta name="theme-color" content="#FFE9F1">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<title>Peggy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{
  /* Peggy in bloom: petal backgrounds, peony actions, lilac accents, plum ink */
  --bg:#FFE9F1; --panel:#FFF8FB; --panel2:#FBDCE8; --line:#F4C6D8;
  --text:#4A1D3F; --dim:#9B6B8E; --accent:#D1386E; --accent2:#D1386E; --lilac:#8B6CE0;
  --star:#F5A524; --ok:#1F9D63; --danger:#C62A4A; --photo:#2A1230;
  --display:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;
  --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom);
  --sl:env(safe-area-inset-left); --sr:env(safe-area-inset-right);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:500 16px/1.45 "Nunito",ui-rounded,-apple-system,system-ui,sans-serif;overscroll-behavior:none}
button{font:inherit;font-weight:700;color:inherit;background:var(--panel2);border:0;border-radius:14px;padding:10px 14px;min-height:44px;cursor:pointer}
button:disabled{opacity:.45}
button.primary{background:var(--accent);color:#fff;font-weight:800;box-shadow:0 3px 0 #A82556}
button.fb{background:var(--accent2);color:#fff;font-weight:800;box-shadow:0 3px 0 #A82556}
button.danger{color:var(--danger)}
button.ghost{background:transparent}
input,textarea{font:inherit;color:var(--text);background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.hidden{display:none!important}

/* header */
header{position:sticky;top:0;z-index:5;background:rgba(255,233,241,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:calc(var(--st) + 8px) calc(var(--sr) + 12px) 8px calc(var(--sl) + 12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:8px}
.bar h1{font:600 26px/1 var(--display);margin:0;flex:1;color:var(--accent);display:flex;align-items:center;gap:6px;letter-spacing:.2px}
.bar h1 .bfly{flex:none;margin-top:-2px}
.bfly .wing{transform-box:view-box;transform-origin:50px 44px}
.bfly.flutter .wing{animation:flap 1.6s ease-in-out infinite}
@keyframes flap{0%,70%,100%{transform:scaleX(1)}80%{transform:scaleX(.45)}90%{transform:scaleX(.9)}}
@media (prefers-reduced-motion:reduce){.bfly .wing{animation:none!important}}
.chips{display:flex;gap:8px;overflow-x:auto;padding-top:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border-radius:999px;padding:6px 14px;min-height:34px;font-size:14px;background:var(--panel2);color:var(--dim)}
.chip.on{background:var(--text);color:#fff;font-weight:800}
.chip .n{opacity:.6;margin-left:4px}

/* grid */
main{padding:4px calc(var(--sr) + 4px) calc(var(--sb) + 100px) calc(var(--sl) + 4px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:4px}
@media (min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}}
.cell{position:relative;aspect-ratio:1;background:var(--panel2);border-radius:10px;overflow:hidden;cursor:pointer}
.cell img{width:100%;height:100%;object-fit:cover;display:block}
.badges{position:absolute;left:5px;bottom:4px;display:flex;gap:4px;font-size:13px;text-shadow:0 1px 3px #000}
.badges .star{color:var(--star)} .badges .posted{color:var(--ok)}
.check{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.25);display:none}
.selecting .check{display:block}
.cell.sel .check{background:var(--accent);border-color:var(--accent)}
.cell.sel .check::after{content:"✓";color:#fff;font-size:15px;font-weight:700;display:block;text-align:center;line-height:20px}
.cell.sel img{opacity:.75}
.empty{text-align:center;color:var(--dim);padding:60px 24px}
.empty h2{color:var(--text);font:600 24px var(--display);margin:6px 0 8px}
.empty .trail{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin-bottom:4px}
.empty .trail .bfly:nth-child(1){transform:rotate(-18deg) translateY(-14px);opacity:.55}
.empty .trail .bfly:nth-child(2){transform:rotate(-8deg) translateY(-26px);opacity:.75}
.empty .trail .bfly:nth-child(3){transform:rotate(6deg)}
.empty p{max-width:30ch;margin:0 auto}

/* bottom selection bar */
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);
  padding:10px calc(var(--sr) + 10px) calc(var(--sb) + 10px) calc(var(--sl) + 10px);display:flex;gap:8px;align-items:center;overflow-x:auto}
.selbar .count{flex:1;min-width:70px;color:var(--dim);font-size:14px}

/* overlays */
.overlay{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.ohead{display:flex;align-items:center;gap:8px;padding:calc(var(--st) + 8px) calc(var(--sr) + 10px) 8px calc(var(--sl) + 10px);border-bottom:1px solid var(--line)}
.ohead .t{flex:1;text-align:center;font:600 18px var(--display)}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px;touch-action:none;background:var(--photo)}
.stage canvas{max-width:100%;max-height:100%;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.tools{background:var(--panel);padding:10px calc(var(--sr) + 12px) calc(var(--sb) + 10px) calc(var(--sl) + 12px)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;min-height:38px;padding:6px}
.tabs button.on{background:var(--text);color:#fff;font-weight:800}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row button{flex:1 1 auto;min-width:64px;font-size:14px}
.row button.on{outline:2px solid var(--accent)}
.slider{display:grid;grid-template-columns:96px 1fr 40px;align-items:center;gap:10px;margin:6px 0;font-size:14px}
.slider span:last-child{text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
.slider label{cursor:pointer}
input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--accent);height:32px}
.presets{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.preset{flex:none;width:76px;text-align:center;font-size:12px;color:var(--dim);cursor:pointer}
.preset canvas,.preset .ph{width:76px;height:76px;border-radius:8px;object-fit:cover;display:block;background:var(--panel2);margin-bottom:4px}
.preset.on{color:var(--text);font-weight:800}
.preset.on canvas{outline:2px solid var(--accent);outline-offset:2px}

/* post */
.postbody{flex:1;overflow:auto;padding:14px calc(var(--sr) + 14px) calc(var(--sb) + 20px) calc(var(--sl) + 14px);max-width:720px;width:100%;margin:0 auto}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.pthumb{flex:none;position:relative;width:96px}
.pthumb img{width:96px;height:96px;object-fit:cover;border-radius:8px;display:block}
.pthumb .ord{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.65);border-radius:6px;padding:0 6px;font-size:12px}
.pthumb .acts{display:flex;gap:4px;margin-top:4px}
.pthumb .acts button{flex:1;min-height:30px;padding:2px;font-size:13px}
.hint{color:var(--dim);font-size:14px}
textarea{min-height:120px;resize:vertical;margin:12px 0}

/* sheet / dialog */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(74,29,63,.45);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.scrim{align-items:center}}
.sheet{background:var(--panel);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px 16px calc(var(--sb) + 16px);max-height:88vh;overflow:auto}
@media (min-width:700px){.sheet{border-radius:16px}}
.sheet h3{margin:0 0 6px;font:600 21px var(--display)}
.sheet p{margin:6px 0 12px;color:var(--dim);font-size:14px}
.sheet .stack{display:flex;flex-direction:column;gap:8px}
.sheet .stack button{text-align:left}
.sheet label.f{display:block;font-size:13px;color:var(--dim);margin:12px 0 4px}
.sheet code{font-size:12px;background:var(--bg);padding:2px 6px;border-radius:6px;word-break:break-all}
a.big{display:block;text-align:center;background:var(--accent);color:#fff;text-decoration:none;font-weight:800;border-radius:14px;padding:13px;box-shadow:0 3px 0 #A82556}
.progress{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin:12px 0}
.progress div{height:100%;background:var(--accent);width:0;transition:width .2s}

#btnTv{position:relative;padding:10px}
.tl{display:none;font-weight:700;font-size:15px}
@media (min-width:700px){ .tl{display:inline} #btnWords,#btnTv,#btnSettings{display:inline-flex;align-items:center;gap:6px;padding:8px 12px} }
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
#sTv{display:inline-flex;align-items:center;gap:6px} #sTv .ic{width:20px;height:20px}
#btnImport{white-space:nowrap}
.selbar button{padding:10px 13px}
.selbar .count{flex:none;min-width:30px;height:30px;padding:0 8px;border-radius:15px;background:var(--accent);color:#fff;font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;margin-right:auto}
@media (max-width:420px){ .lbl{display:none} #btnImport{font-size:24px;line-height:1;width:44px;padding:0;border-radius:50%} }
@media (max-width:360px){ .wm{display:none} .iconlink{min-width:38px!important;padding:8px 6px} .lbl{display:none} .bar h1{font-size:18px!important} .bar button{padding:10px 8px!important} }
@media (max-width:420px){ .bar{gap:4px} .bar h1{font-size:20px} .bar button{padding:10px 10px} #btnTv,.iconlink,#btnSettings{min-width:38px;padding:8px 6px} }
.iconlink{color:var(--text);display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;border-radius:10px;text-decoration:none;font-size:18px}
.tvdot{position:absolute;right:6px;top:8px;width:9px;height:9px;border-radius:50%;background:transparent}
.tvdot.on{background:var(--ok)} .tvdot.wait{background:var(--star)}
.remote{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.remote button{font-size:22px}
.codein{font-size:32px;text-align:center;letter-spacing:12px;text-transform:uppercase;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 90px);z-index:40;background:var(--text);color:#fff;font-weight:700;
  padding:10px 16px;border-radius:12px;font-size:14px;max-width:90vw;box-shadow:0 8px 24px rgba(74,29,63,.3);text-align:center}
</style>
</head>
<body>

<header>
  <div class="bar">
    <h1 id="wordmark">Peggy</h1>
    <button id="btnImport" class="primary" aria-label="Import">＋<span class="lbl"> Import</span></button>
    <button id="btnSelect">Select</button>
    <a id="btnWords" class="ghost iconlink" href="words.html" aria-label="Words" title="Words"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg><span class="tl">Words</span></a>
    <button id="btnTv" class="ghost" aria-label="TV"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="3"/><path d="M8.5 21h7M9 2.5l3 3.5 3-3.5"/></svg><span class="tl">TV</span><span class="tvdot" id="tvDot"></span></button>
    <button id="btnSettings" class="ghost" aria-label="Settings"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg><span class="tl">Settings</span></button>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main id="main">
  <div class="grid" id="grid"></div>
  <div class="empty hidden" id="empty"></div>
</main>

<div class="selbar hidden" id="selbar">
  <span class="count" id="selCount">0</span>
  <button id="sAll">All</button>
  <button id="sFav">★</button>
  <button id="sAlbum">Album</button>
  <button id="sMore">More</button>
  <button id="sTv" class="hidden"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="3"/><path d="M8.5 21h7M9 2.5l3 3.5 3-3.5"/></svg><span>TV</span></button>
  <button id="sPost" class="fb">Post</button>
</div>

<!-- Editor -->
<div class="overlay hidden" id="editor">
  <div class="ohead">
    <button id="edCancel" class="ghost">Cancel</button>
    <span class="t" id="edTitle">Edit</span>
    <button id="edSave" class="primary">Save</button>
  </div>
  <div class="stage" id="edStage"></div>
  <div class="tools">
    <div class="tabs">
      <button data-tab="crop" class="on">Crop</button>
      <button data-tab="adjust">Adjust</button>
      <button data-tab="filters">Filters</button>
    </div>
    <div data-panel="crop">
      <div class="row" id="aspects"></div>
      <div class="slider"><label>Zoom</label><input type="range" id="zoom" min="1" max="3" step="0.01" value="1"><span id="zoomV">1.0×</span></div>
      <div class="row">
        <button id="rotL">⟲ Rotate</button>
        <button id="rotR">⟳ Rotate</button>
        <button id="flip">⇋ Flip</button>
        <button id="edReset" class="danger">Revert</button>
      </div>
      <p class="hint" style="margin:8px 0 0">Drag the photo to reposition the crop.</p>
    </div>
    <div data-panel="adjust" class="hidden" id="sliders"></div>
    <div data-panel="filters" class="hidden"><div class="presets" id="presets"></div></div>
  </div>
</div>

<!-- Post -->
<div class="overlay hidden" id="post">
  <div class="ohead">
    <button id="postBack" class="ghost">‹ Back</button>
    <span class="t">Post to Facebook</span>
    <span style="width:64px"></span>
  </div>
  <div class="postbody">
    <div class="strip" id="postStrip"></div>
    <textarea id="caption" placeholder="Write a caption…"></textarea>
    <button id="shareBtn" class="fb" style="width:100%" disabled>Preparing photos…</button>
    <p class="hint" id="postHint">Tapping Share copies your caption, then opens the share sheet. Choose <b>Facebook</b>, then long-press the text box and tap <b>Paste</b> to add the caption.</p>
  </div>
</div>

<input type="file" id="fileIn" accept="image/*" multiple hidden>

<script src="core.js"></script>
<script src="core-butterfly.js"></script>
<script>
'use strict';
/* ---------- config ---------- */
const SCOPE = 'https://www.googleapis.com/auth/photospicker.mediaitems.readonly';
const cfg = {
  get clientId(){ return (localStorage.getItem('peggy.clientId')||'').trim(); },
  get relay(){ return (localStorage.getItem('peggy.relay')||'').trim().replace(/\/+$/,''); },
};


/* ---------- state ---------- */
let photos=[], albums=[], view='all', selecting=false;
const selected = new Set();
const thumbURL = new Map();
function urlFor(p){ if(!thumbURL.has(p.id)) thumbURL.set(p.id, URL.createObjectURL(p.thumb)); return thumbURL.get(p.id); }
function dropURL(id){ const u=thumbURL.get(id); if(u){ URL.revokeObjectURL(u); thumbURL.delete(id); } }


/* ---------- grid / chips ---------- */
function visible(){
  let l = photos;
  if(view==='fav') l=l.filter(p=>p.fav);
  else if(view==='todo') l=l.filter(p=>!p.postedAt);
  else if(view==='posted') l=l.filter(p=>p.postedAt);
  else if(view!=='all') l=l.filter(p=>p.albums.includes(view));
  return l.slice().sort((a,b)=>b.created-a.created);
}
function renderChips(){
  const box=$('#chips'); box.replaceChildren();
  const add=(id,label,n)=>{ const b=el('button',{className:'chip'+(view===id?' on':'')},label); if(n!=null) b.append(el('span',{className:'n',textContent:n}));
    b.onclick=()=>{ if(view===id && albums.some(a=>a.id===id)) return albumMenu(id); view=id; selected.clear(); renderAll(); }; box.append(b); };
  add('all','All',photos.length);
  add('fav','★ Favorites',photos.filter(p=>p.fav).length);
  add('todo','Not posted',photos.filter(p=>!p.postedAt).length);
  add('posted','Posted',photos.filter(p=>p.postedAt).length);
  for(const a of albums.slice().sort((x,y)=>x.name.localeCompare(y.name))) add(a.id, a.name, photos.filter(p=>p.albums.includes(a.id)).length);
  const nb=el('button',{className:'chip',textContent:'＋ Album'}); nb.onclick=()=>newAlbum(); box.append(nb);
  if(!albums.some(a=>a.id===view) && !['all','fav','todo','posted'].includes(view)) view='all';
}
function renderGrid(){
  const grid=$('#grid'), list=visible();
  grid.classList.toggle('selecting', selecting);
  grid.replaceChildren(...list.map(p=>{
    const c=el('div',{className:'cell'+(selected.has(p.id)?' sel':'')});
    c.append(el('img',{src:urlFor(p),alt:'',loading:'lazy',decoding:'async'}));
    const bd=el('div',{className:'badges'});
    if(p.fav) bd.append(el('span',{className:'star',textContent:'★'}));
    if(edited(p)) bd.append(el('span',{textContent:'✎'}));
    if(p.postedAt) bd.append(el('span',{className:'posted',textContent:'✓'}));
    c.append(bd, el('div',{className:'check'}));
    c.onclick=()=>{ if(selecting){ selected.has(p.id)?selected.delete(p.id):selected.add(p.id); c.classList.toggle('sel'); updateSelbar(); } else openEditor(p); };
    return c;
  }));
  const empty=$('#empty');
  if(list.length){ empty.classList.add('hidden'); }
  else {
    empty.classList.remove('hidden');
    empty.replaceChildren(...(photos.length
      ? [el('h2',{textContent:'Nothing here yet'}), el('p',{textContent:'Select photos in All and use Album or ★ to fill this view.'})]
      : [Object.assign(el('div',{className:'trail'}),{innerHTML:butterfly({size:30})+butterfly({size:40})+butterfly({size:64,flutter:true})}), el('h2',{textContent:'Welcome to Peggy'}), el('p',{textContent:'Tap ＋ to bring in photos from Google Photos or this phone. Then make them pretty and share them on Facebook.'})]));
  }
}
function updateSelbar(){
  $('#selbar').classList.toggle('hidden', !selecting);
  $('#btnSelect').textContent = selecting ? 'Done' : 'Select';
  const n=selected.size; $('#selCount').textContent = n; $('#selCount').setAttribute('aria-label', n+' selected');
  for(const id of ['#sFav','#sAlbum','#sMore','#sPost','#sTv']) $(id).disabled = !n;
  $('#sTv').classList.toggle('hidden', !tv.code);
  $('#sAll').textContent = n && n===visible().length ? 'None' : 'All';
}
function renderAll(){ renderChips(); renderGrid(); updateSelbar(); }

/* ---------- sheets ---------- */
function sheet(build){ return new Promise(resolve=>{
  const scrim=el('div',{className:'scrim'}), sh=el('div',{className:'sheet'}); scrim.append(sh);
  const close=v=>{ scrim.remove(); resolve(v); };
  scrim.onclick=e=>{ if(e.target===scrim) close(null); };
  build(sh, close); document.body.append(scrim);
}); }
function actions(title, items, text){ return sheet((sh,close)=>{
  sh.append(el('h3',{textContent:title})); if(text) sh.append(el('p',{textContent:text}));
  const st=el('div',{className:'stack'});
  for(const [label,val,cls] of items){ const b=el('button',{textContent:label,className:cls||''}); b.onclick=()=>close(val); st.append(b); }
  const c=el('button',{textContent:'Cancel',className:'ghost'}); c.onclick=()=>close(null); st.append(c); sh.append(st);
}); }

/* ---------- albums ---------- */
async function newAlbum(withSelected){
  const name=(prompt('Album name')||'').trim(); if(!name) return null;
  const a={id:uid(), name, created:Date.now()}; albums.push(a); await dbPut('albums',a);
  if(withSelected) await addToAlbum(a.id); else { view=a.id; renderAll(); }
  return a;
}
async function addToAlbum(aid){
  for(const p of photos) if(selected.has(p.id) && !p.albums.includes(aid)){ p.albums.push(aid); await dbPut('photos',p); }
  toast(`Added ${selected.size} to ${albums.find(a=>a.id===aid).name}`); renderAll();
}
async function albumMenu(aid){
  const a=albums.find(x=>x.id===aid);
  const v=await actions(a.name,[['Rename','rename'],['Delete album (keeps photos)','del','danger']]);
  if(v==='rename'){ const n=(prompt('Album name',a.name)||'').trim(); if(n){ a.name=n; await dbPut('albums',a); renderAll(); } }
  if(v==='del' && confirm(`Delete album “${a.name}”? Photos stay in your library.`)){
    albums=albums.filter(x=>x.id!==aid); await dbDel('albums',aid);
    for(const p of photos) if(p.albums.includes(aid)){ p.albums=p.albums.filter(x=>x!==aid); await dbPut('photos',p); }
    view='all'; renderAll();
  }
}

/* ---------- selection actions ---------- */
$('#btnSelect').onclick=()=>{ selecting=!selecting; selected.clear(); renderGrid(); updateSelbar(); };
$('#sAll').onclick=()=>{ const l=visible(); if(selected.size===l.length) selected.clear(); else l.forEach(p=>selected.add(p.id)); renderGrid(); updateSelbar(); };
$('#sFav').onclick=async()=>{

async function importBlobs(list, prog){
  askPersist(); let n=0, fail=0;
  for(const it of list){
    try{
      const thumb=await makeThumb(it.blob);
      const p={id:uid(), src:it.src, gid:it.gid||null, name:it.name||'photo', created:it.created, added:Date.now(), blob:it.blob, thumb,
        edits:null, fav:false, albums: albums.some(a=>a.id===view)?[view]:[], postedAt:null};
      await dbPut('photos',p); photos.push(p); n++;
    }catch(err){ console.error(err); fail++; }
    prog && prog(n+fail, list.length);
  }
  renderAll(); toast(`Imported ${n} photo${n===1?'':'s'}`+(fail?` · ${fail} failed`:''));
}
let persistAsked=false;
function askPersist(){ if(!persistAsked && navigator.storage && navigator.storage.persist){ persistAsked=true; navigator.storage.persist().catch(()=>{}); } }

/* ---------- import: Google Photos Picker API ---------- */
const redirectUri = () => location.origin + location.pathname.replace(/index\.html$/,'');
function getToken(){ try{ const t=JSON.parse(localStorage.getItem('peggy.token')||'null'); return t && t.exp>Date.now() ? t.v : null; }catch{ return null; } }
function signIn(after){
  const state=uid(); localStorage.setItem('peggy.state',state); localStorage.setItem('peggy.after',after||'');
  location.href='https://accounts.google.com/o/oauth2/v2/auth?'+new URLSearchParams({
    client_id:cfg.clientId, redirect_uri:redirectUri(), response_type:'token', scope:SCOPE, state, include_granted_scopes:'true' });
}
function handleRedirect(){
  if(!location.hash.includes('access_token=') && !location.hash.includes('error=')) return null;
  const h=new URLSearchParams(location.hash.slice(1)); history.replaceState(null,'',location.pathname+location.search);
  if(h.get('error')){ toast('Google sign-in was cancelled ('+h.get('error')+')'); return null; }
  if(h.get('state')!==localStorage.getItem('peggy.state')){ toast('Sign-in check failed, please try again.'); return null; }
  localStorage.setItem('peggy.token', JSON.stringify({v:h.get('access_token'), exp:Date.now()+(parseInt(h.get('expires_in')||'3600',10)-120)*1000}));
  const after=localStorage.getItem('peggy.after'); localStorage.removeItem('peggy.after'); return after;
}
async function api(method, path, body){
  const t=getToken(); if(!t){ const e=new Error('signed out'); e.status=401; throw e; }
  const r=await fetch(cfg.relay+'/picker'+path,{method, headers:{Authorization:'Bearer '+t, ...(body?{'Content-Type':'application/json'}:{})}, body:body?JSON.stringify(body):undefined});
  if(!r.ok){ let msg=r.status+''; try{ msg=(await r.json()).error?.message||msg; }catch{} const e=new Error(msg); e.status=r.status; throw e; }
  return r.status===204 ? {} : r.json();
}
const secs = s => parseFloat(String(s||'').replace('s',''))||0;
const pending = () => { try{ return JSON.parse(localStorage.getItem('peggy.session')||'null'); }catch{ return null; } };
function needsSetup(){
  if(cfg.clientId && cfg.relay) return false;
  openSettings('Google Photos import needs a one-time setup: paste your Google OAuth Client ID and your relay URL (see the README).'); return true;
}
async function startGoogleImport(){
  if(needsSetup()) return;
  if(!getToken()) return signIn('import');
  try{
    const s=await api('POST','/v1/sessions',{});
    localStorage.setItem('peggy.session', JSON.stringify({id:s.id, uri:s.pickerUri,
      interval:Math.max(2,secs(s.pollingConfig?.pollInterval)||4), until:Date.now()+(secs(s.pollingConfig?.timeoutIn)||1800)*1000}));
    showWaiting(); poll();
  }catch(e){ if(e.status===401) return signIn('import'); toast('Could not start Google Photos: '+e.message, 6000); }
}
let waitClose=null, pollT=null;
function showWaiting(){
  const s=pending(); if(!s || waitClose) return;
  sheet((sh,close)=>{
    waitClose=v=>{ waitClose=null; close(v); };
    sh.append(el('h3',{textContent:'Pick photos in Google Photos'}),
      el('p',{textContent:'Tap the button, select your photos, tap Done, then come back to Peggy. They\'ll import automatically.'}));
    const a=el('a',{className:'big',href:s.uri+'/autoclose',target:'_blank',rel:'noopener',textContent:'Open Google Photos'});
    const status=el('p',{id:'pickStatus',textContent:'Waiting for your selection…'});
    const cancel=el('button',{className:'ghost',textContent:'Cancel',style:'width:100%;margin-top:8px'});
    cancel.onclick=()=>{ clearTimeout(pollT); api('DELETE','/v1/sessions/'+s.id).catch(()=>{}); localStorage.removeItem('peggy.session'); waitClose(null); };
    sh.append(a, status, cancel);
  });
}
async function poll(){
  clearTimeout(pollT); const s=pending(); if(!s) return;
  if(Date.now()>s.until){ localStorage.removeItem('peggy.session'); waitClose&&waitClose(); return toast('The Google Photos picker timed out. Try Import again.'); }
  try{
    const r=await api('GET','/v1/sessions/'+s.id);
    if(r.mediaItemsSet){ waitClose&&waitClose(); return downloadPicked(s.id); }
  }catch(e){
    if(e.status===401){ waitClose&&waitClose(); toast('Google sign-in expired — tap Import to continue.'); localStorage.removeItem('peggy.token'); return; }
    if(e.status===404){ localStorage.removeItem('peggy.session'); waitClose&&waitClose(); return toast('That picker session ended. Tap Import to try again.'); }
  }
  pollT=setTimeout(poll, s.interval*1000);
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && pending() && getToken()) poll(); });

async function downloadPicked(sessionId){
  let prog;
  sheet((sh,close)=>{ const bar=el('div'), st=el('p',{textContent:'Getting your selection…'});
    sh.append(el('h3',{textContent:'Importing from Google Photos'}), st, el('div',{className:'progress'},bar));
    prog={ set:(d,n)=>{ bar.style.width=(n?100*d/n:0)+'%'; st.textContent=`${d} of ${n}`; }, close }; });
  try{
    let items=[], pageToken;
    do{ const q=new URLSearchParams({sessionId, pageSize:'100'}); if(pageToken) q.set('pageToken',pageToken);
        const r=await api('GET','/v1/mediaItems?'+q); items.push(...(r.mediaItems||[])); pageToken=r.nextPageToken; }while(pageToken);
    const have=new Set(photos.map(p=>p.gid).filter(Boolean));
    const vids=items.filter(i=>i.type!=='PHOTO').length, dup=items.filter(i=>i.type==='PHOTO' && have.has(i.id)).length;
    items=items.filter(i=>i.type==='PHOTO' && !have.has(i.id));
    const t=getToken(), got=[], total=items.length; let done=0; prog.set(0,total);
    const worker=async()=>{ while(items.length){ const it=items.shift();
      try{ const r=await fetch(cfg.relay+'/media?u='+encodeURIComponent(it.mediaFile.baseUrl+'=w2560-h2560'),{headers:{Authorization:'Bearer '+t}});
           if(!r.ok) throw new Error(r.status);
           got.push({blob:await r.blob(), name:it.mediaFile.filename, created:Date.parse(it.createTime)||Date.now(), src:'google', gid:it.id});
      }catch(e){ console.error('download',e); }
      prog.set(++done, total); } };
    await Promise.all([worker(),worker(),worker()]);
    prog.close();
    await importBlobs(got);
    const notes=[]; if(vids) notes.push(`${vids} video${vids>1?'s':''} skipped`); if(dup) notes.push(`${dup} already here`);
    if(total-got.length) notes.push(`${total-got.length} failed to download`);
    if(notes.length) setTimeout(()=>toast(notes.join(' · '),5000),3300);
  }catch(e){ prog&&prog.close(); toast('Import failed: '+e.message, 6000); }
  finally{ api('DELETE','/v1/sessions/'+sessionId).catch(()=>{}); localStorage.removeItem('peggy.session'); }
}

let ed=null, raf=0;
async function openEditor(p){
  try{
    const img=await loadImage(p.blob);
    ed={p, img, e:{...DEF, ...(p.edits||{})}, dirty:false};
    $('#edTitle').textContent=p.name; $('#editor').classList.remove('hidden'); document.body.style.overflow='hidden';
    selTab('crop'); syncControls(); draw(); buildPresets();
  }catch(err){ toast(err.message); }
}
function closeEditor(){ $('#editor').classList.add('hidden'); document.body.style.overflow=''; ed=null; $('#edStage').replaceChildren(); $('#presets').replaceChildren(); }
function draw(){
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(()=>{ if(!ed) return; const st=$('#edStage'), r=st.getBoundingClientRect();
    const max=Math.round(Math.max(r.width,r.height)*Math.min(devicePixelRatio||1,2));
    const c=render(ed.img, ed.e, Math.max(400, Math.min(max, 1600)));
    c.style.width='auto'; c.style.height='auto'; st.replaceChildren(c); ed.c=c; });
}
function change(k,v){ ed.e[k]=v; ed.dirty=true; syncControls(); draw(); }
function selTab(t){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.tab===t));
  document.querySelectorAll('[data-panel]').forEach(p=>p.classList.toggle('hidden', p.dataset.panel!==t));
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>selTab(b.dataset.tab));
(function buildStatic(){

function syncControls(){

async function buildPresets(){

(function pan(){
  const st=$('#edStage'); let s=null;
  st.addEventListener('pointerdown',e=>{ if(!ed||!ed.c) return; s={x:e.clientX,y:e.clientY,px:ed.e.panX,py:ed.e.panY}; st.setPointerCapture(e.pointerId); });
  st.addEventListener('pointermove',e=>{ if(!s||!ed||!ed.c) return; const g=ed.c._geom, r=ed.c.getBoundingClientRect();
    const sx=g.cw/r.width, sy=g.ch/r.height;
    const nx = g.sw>g.cw+.5 ? clamp(s.px-(e.clientX-s.x)*sx/((g.sw-g.cw)/2),-1,1) : 0;
    const ny = g.sh>g.ch+.5 ? clamp(s.py-(e.clientY-s.y)*sy/((g.sh-g.ch)/2),-1,1) : 0;
    if(nx!==ed.e.panX || ny!==ed.e.panY){ ed.e.panX=nx; ed.e.panY=ny; ed.dirty=true; draw(); } });
  const end=()=>{ s=null; }; st.addEventListener('pointerup',end); st.addEventListener('pointercancel',end);
})();

/* ---------- post ---------- */
let post=null;
async function openPost(ids, plain){
  if(!ids.length) return;
  post={ids:[...ids], files:new Map(), plain:!!plain};
  $('#post').classList.remove('hidden'); document.body.style.overflow='hidden';
  $('#caption').classList.toggle('hidden', post.plain);
  $('#postHint').classList.toggle('hidden', post.plain);
  $('#caption').value=localStorage.getItem('peggy.caption')||'';
  renderStrip(); setShare();
  const mine=post;
  for(const id of ids){
    const p=photos.find(x=>x.id===id);
    try{ const img=await loadImage(p.blob); const b=await toBlob(render(img, p.edits||DEF, 2048),'image/jpeg',.9);
         const base=(p.name||'photo').replace(/\.[^.]+$/,'').replace(/[^\w\- ]+/g,'_')||'photo';
         if(post!==mine) return; post.files.set(id, new File([b], base+'.jpg', {type:'image/jpeg', lastModified:Date.now()})); }
    catch(e){ console.error(e); toast('Could not prepare '+p.name); post.ids=post.ids.filter(x=>x!==id); renderStrip(); }
    setShare();
  }
}
function setShare(){
  const b=$('#shareBtn'), n=post.ids.length, ready=post.ids.every(id=>post.files.has(id));
  b.disabled=!ready||!n;
  b.textContent = !n ? 'No photos selected' : !ready ? `Preparing ${post.files.size} of ${n}…` : post.plain ? `Share ${n} photo${n>1?'s':''}…` : `Share ${n} photo${n>1?'s':''} to Facebook`;
}
function renderStrip(){
  const s=$('#postStrip');
  s.replaceChildren(...post.ids.map((id,i)=>{ const p=photos.find(x=>x.id===id);
    const left=el('button',{textContent:'◀',disabled:i===0}); left.onclick=()=>{ [post.ids[i-1],post.ids[i]]=[post.ids[i],post.ids[i-1]]; renderStrip(); };
    const rm=el('button',{textContent:'✕'}); rm.onclick=()=>{ post.ids.splice(i,1); renderStrip(); setShare(); };
    return el('div',{className:'pthumb'}, el('img',{src:urlFor(p),alt:''}), el('span',{className:'ord',textContent:i+1}), el('div',{className:'acts'},left,rm));
  }));
}
$('#caption').oninput=e=>localStorage.setItem('peggy.caption',e.target.value);
$('#postBack').onclick=()=>{ $('#post').classList.add('hidden'); document.body.style.overflow=''; post=null; };
$('#shareBtn').onclick=()=>{
  // Everything here must start synchronously inside the tap, or iOS blocks the share sheet.
  const files=post.ids.map(id=>post.files.get(id)), cap=$('#caption').value.trim(), ids=[...post.ids], plain=post.plain;
  if(cap && !plain && navigator.clipboard) navigator.clipboard.writeText(cap).catch(()=>{});
  const data={files};
  if(navigator.canShare && navigator.canShare(data)){
    navigator.share(data).then(async()=>{
      if(plain){ toast('Shared'); return; }
      for(const id of ids){ const p=photos.find(x=>x.id===id); if(p){ p.postedAt=Date.now(); await dbPut('photos',p); } }
      localStorage.removeItem('peggy.caption'); $('#postBack').click(); selecting=false; selected.clear(); renderAll(); toast('Marked as posted ✓');
    }).catch(err=>{ if(err.name!=='AbortError') toast('Share failed: '+err.message, 5000); });
  } else {
    for(const f of files){ const a=el('a',{href:URL.createObjectURL(f),download:f.name}); document.body.append(a); a.click(); a.remove(); }
    toast('This browser can\'t open the share sheet, so the photos were downloaded instead.', 5000);
  }
};


/* ---------- TV (Fire Stick) link ---------- */
// The TV shows a 4-letter code; the phone connects to it directly over the network (PeerJS / WebRTC).
const tv = { code:(localStorage.getItem('peggy.tv')||''), peer:null, conn:null, state:'off', waits:new Map(), connecting:null };
function tvSetState(st){ tv.state=st; const d=$('#tvDot'); d.className='tvdot'+(st==='on'?' on':st==='wait'?' wait':''); updateSelbar(); }
function loadPeerJS(){ return window.Peer ? Promise.resolve() : new Promise((res,rej)=>{ const s=el('script',{src:'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'}); s.onload=res; s.onerror=()=>rej(new Error('Could not load the TV connector — check your internet.')); document.head.append(s); }); }
function tvConnect(){
  if(tv.conn && tv.conn.open) return Promise.resolve(tv.conn);
  if(tv.connecting) return tv.connecting;
  if(!tv.code) return Promise.reject(new Error('No TV paired'));
  tvSetState('wait');
  tv.connecting = (async()=>{
    await loadPeerJS();
    if(!tv.peer || tv.peer.destroyed){ tv.peer=new Peer(); await new Promise((res,rej)=>{ tv.peer.once('open',res); tv.peer.once('error',rej); }); }
    else if(tv.peer.disconnected){ tv.peer.reconnect(); await sleep(800); }
    const c=tv.peer.connect(PEER_PREFIX+tv.code,{reliable:true, serialization:'binary'});
    await new Promise((res,rej)=>{ const t=setTimeout(()=>rej(new Error(`Couldn't reach TV ${tv.code}. Make sure Peggy is open on the Fire Stick.`)),12000);
      c.on('open',()=>{ clearTimeout(t); res(); }); tv.peer.once('error',e=>{ clearTimeout(t); rej(new Error(e.type==='peer-unavailable'?`TV ${tv.code} isn't online. Open Peggy on the Fire Stick.`:e.message)); }); });
    c.on('data',m=>{ if(m && m.t==='ack'){ const w=tv.waits.get(m.i); if(w){ tv.waits.delete(m.i); m.error?w.rej(new Error(m.error)):w.res(); } } });
    c.on('close',()=>{ if(tv.conn===c){ tv.conn=null; tvSetState('off'); for(const w of tv.waits.values()) w.rej(new Error('TV disconnected')); tv.waits.clear(); } });
    tv.conn=c; tvSetState('on'); return c;
  })().catch(e=>{ tvSetState('off'); throw e; }).finally(()=>{ tv.connecting=null; });
  return tv.connecting;
}
function tvForget(){ try{ tv.conn&&tv.conn.close(); }catch{} try{ tv.peer&&tv.peer.destroy(); }catch{} tv.conn=null; tv.peer=null; tv.code=''; localStorage.removeItem('peggy.tv'); tvSetState('off'); }
function tvSend(msg, timeout=60000){ return new Promise((res,rej)=>{ const t=setTimeout(()=>{ tv.waits.delete(msg.i); rej(new Error('The TV stopped responding')); },timeout);
  tv.waits.set(msg.i,{res:()=>{clearTimeout(t);res();}, rej:e=>{clearTimeout(t);rej(e);}}); tv.conn.send(msg); }); }
function tvPair(code){ code=(code||'').toUpperCase().replace(/[^A-Z0-9]/g,''); if(code.length!==4) return toast('TV codes are 4 characters');
  if(code!==tv.code){ tvForget(); tv.code=code; localStorage.setItem('peggy.tv',code); }
  return tvConnect().then(()=>toast(`Connected to TV ${code} ✓`)).catch(e=>toast(e.message,6000)); }
$('#btnTv').onclick=()=>sheet((sh,close)=>{
  sh.append(el('h3',{textContent:'Fire TV'}));
  if(!tv.code){
    sh.append(el('p',{textContent:'Open Peggy on your Fire Stick. Enter the 4-letter code shown on the TV.'}));
    const i=el('input',{className:'codein',maxLength:4,autocapitalize:'characters',autocorrect:'off',spellcheck:false,placeholder:'····'});
    const go=el('button',{className:'primary',textContent:'Connect',style:'width:100%;margin-top:10px'}); go.onclick=()=>{ close(); tvPair(i.value); };
    sh.append(i,go);
  } else {
    sh.append(el('p',{textContent: tv.state==='on' ? `Connected to TV ${tv.code}.` : `Paired with TV ${tv.code}. Peggy connects when you send photos.`}));
    sh.append(el('p',{textContent:'Select photos, then tap TV to show them as a slideshow or copy them to the TV.'}));
    const st=el('div',{className:'stack'});
    if(tv.state!=='on'){ const c=el('button',{className:'primary',textContent:'Connect now'}); c.onclick=()=>{ close(); tvConnect().then(()=>toast('Connected ✓')).catch(e=>toast(e.message,6000)); }; st.append(c); }
    else { const r=el('button',{textContent:'Slideshow remote'}); r.onclick=()=>{ close(); tvRemote(); }; st.append(r); }
    const f=el('button',{className:'danger',textContent:'Forget this TV'}); f.onclick=()=>{ tvForget(); close(); toast('TV forgotten'); };
    const x=el('button',{className:'ghost',textContent:'Close'}); x.onclick=()=>close();
    st.append(f,x); sh.append(st);
  }
});
$('#sTv').onclick=async()=>{
  const ids=visible().filter(p=>selected.has(p.id)).map(p=>p.id); if(!ids.length) return;
  const v=await actions(`${ids.length} photo${ids.length>1?'s':''} → TV ${tv.code}`,[['▶ Show on TV now','show','primary'],['Copy to TV (keeps albums and edits)','copy']],
    'Show plays a slideshow right away. Copy saves them in the TV’s own library.');
  if(v==='show') tvShow(ids); if(v==='copy') tvCopy(ids);
};
function tvProgress(title){ let api; sheet((sh,close)=>{ const bar=el('div'), st=el('p',{textContent:'Connecting to the TV…'});
  sh.append(el('h3',{textContent:title}), st, el('div',{className:'progress'},bar));
  const cancel=el('button',{className:'ghost',textContent:'Cancel',style:'width:100%'}); sh.append(cancel);
  api={ cancelled:false, set:(d,n)=>{ bar.style.width=(100*d/n)+'%'; st.textContent=`${d} of ${n} sent`; }, close };
  cancel.onclick=()=>{ api.cancelled=true; close(); }; }); return api; }
async function tvShow(ids){
  const pr=tvProgress('Showing on TV');
  try{
    await tvConnect(); tv.conn.send({t:'show-start', n:ids.length});
    let n=0;
    for(const id of ids){ if(pr.cancelled) break;
      const p=photos.find(x=>x.id===id); const img=await loadImage(p.blob);
      const b=await toBlob(render(img, p.edits||DEF, 1920),'image/jpeg',.88);
      await tvSend({t:'show-item', i:uid(), name:p.name, data:await b.arrayBuffer()});
      pr.set(++n, ids.length); if(n===1){ pr.close(); tvRemote(); }
    }
  }catch(e){ pr.close(); toast(e.message,6000); }
}
async function tvCopy(ids){
  const pr=tvProgress('Copying to TV');
  try{
    await tvConnect(); tv.conn.send({t:'copy-start', n:ids.length});
    let n=0;
    for(const id of ids){ if(pr.cancelled) break;
      const p=photos.find(x=>x.id===id);
      const b=await downscale(p.blob, 2560);
      await tvSend({t:'copy-item', i:uid(), pid:p.id, name:p.name, created:p.created, fav:!!p.fav, edits:p.edits||null,
        albums:p.albums.map(a=>(albums.find(x=>x.id===a)||{}).name).filter(Boolean), data:await b.arrayBuffer()});
      pr.set(++n, ids.length);
    }
    tv.conn.send({t:'copy-end'}); pr.close(); toast(`Copied ${n} photo${n===1?'':'s'} to the TV ✓`);
    selecting=false; selected.clear(); renderAll();
  }catch(e){ pr.close(); toast(e.message,6000); }
}
function tvRemote(){ sheet((sh,close)=>{
  sh.append(el('h3',{textContent:'TV slideshow'}), el('p',{textContent:'You can also use the Fire TV remote: ◀ ▶ to skip, OK to pause.'}));
  const b=(t,a)=>{ const x=el('button',{textContent:t}); x.onclick=()=>{ if(tv.conn&&tv.conn.open) tv.conn.send({t:'ctl',a}); else toast('TV disconnected'); if(a==='stop') close(); }; return x; };
  sh.append(el('div',{className:'remote'}, b('⏮','prev'), b('⏯','pause'), b('⏭','next'), b('⏹','stop')));
  const x=el('button',{className:'ghost',textContent:'Close',style:'width:100%'}); x.onclick=()=>close(); sh.append(x);
}); }

/* ---------- boot ---------- */
(async function boot(){
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  $('#wordmark').innerHTML=butterfly({size:34,flutter:true})+'<span class="wm">Peggy</span>';
  db=await openDB();
  [photos, albums] = await Promise.all([dbAll('photos'), dbAll('albums')]);
  photos.forEach(p=>{ p.albums=p.albums||[]; });
  renderAll();
  const tvParam=new URLSearchParams(location.search).get('tv');
  if(tvParam){ history.replaceState(null,'',location.pathname+location.hash); tvPair(tvParam); }
  const after=handleRedirect();
  if(after==='import') startGoogleImport();
  else if(pending()){ if(getToken()){ showWaiting(); poll(); } else localStorage.removeItem('peggy.session'); }
})();
</script>
