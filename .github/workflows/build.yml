name: Build APK

on:
  push:
    branches: [main]
    paths: ['app/**', '*.gradle', 'gradle.properties', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle assembleDebug --no-daemon

      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk Peggy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Peggy-apk
          path: Peggy.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Peggy.apk --title "Peggy for Fire TV (latest build)" --notes "Install on Fire TV with Downloader." --latest
