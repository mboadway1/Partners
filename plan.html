<style>
:root{
  --bg:#FFE9F1; --panel:#FFF8FB; --panel2:#FBDCE8; --line:#F4C6D8; --text:#4A1D3F; --dim:#9B6B8E; --accent:#D1386E; --accentDark:#A82556; --lilac:#8B6CE0;
  --danger:#C62A4A; --star:#F5A524; --ok:#1F9D63; --headerbg:rgba(255,233,241,.9); --inputbg:#fff;
  --display:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;
  --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom); --sl:env(safe-area-inset-left); --sr:env(safe-area-inset-right);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:500 16px/1.45 "Nunito",ui-rounded,-apple-system,system-ui,sans-serif}
button{font:inherit;font-weight:700;color:inherit;background:var(--panel2);border:0;border-radius:14px;padding:10px 14px;min-height:44px;cursor:pointer}
button:disabled{opacity:.45}
button.primary{background:var(--accent);color:#fff;font-weight:800;box-shadow:0 3px 0 var(--accentDark)}
button.ghost{background:transparent}
button.danger{color:var(--danger)}
input,textarea,select{font:inherit;color:var(--text);background:var(--inputbg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{min-height:80px;resize:vertical}
.hidden{display:none!important}
a{color:var(--accent)}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}

/* header */
header{position:sticky;top:0;z-index:5;background:var(--headerbg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:calc(var(--st) + 8px) calc(var(--sr) + 12px) 8px calc(var(--sl) + 12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:8px}
.bar h1{font:600 24px/1 var(--display);margin:0;flex:1;display:flex;align-items:center;gap:6px;min-width:0;color:var(--text)}
.bar h1 .bfly{flex:none}
.bar h1 .sect{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bfly .wing{transform-box:view-box;transform-origin:50px 44px}
.bfly.flutter .wing{animation:flap 1.6s ease-in-out infinite}
@keyframes flap{0%,70%,100%{transform:scaleX(1)}80%{transform:scaleX(.45)}90%{transform:scaleX(.9)}}
@media (prefers-reduced-motion:reduce){.bfly .wing{animation:none!important}}
.iconbtn{background:transparent;padding:8px;min-width:44px;display:inline-flex;align-items:center;justify-content:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding-top:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border-radius:999px;padding:6px 14px;min-height:34px;font-size:14px;background:var(--panel2);color:var(--dim)}
.chip.on{background:var(--text);color:var(--bg);font-weight:800}
.chip .n{opacity:.6;margin-left:4px}

main{padding:10px calc(var(--sr) + 12px) calc(var(--sb) + 96px) calc(var(--sl) + 12px);max-width:860px;margin:0 auto}
/* On the TV: use the whole screen */
html.tv main{max-width:none;padding-left:24px;padding-right:24px}
html.tv .bnav a{max-width:none}
html.tv body{zoom:2.2}   /* big text on the TV, same as Words */
html.tv.cal body{zoom:1.15}
.mc .e[hidden]{display:none}
html.tv.cal .sheet{zoom:1}
html.tv .sheet{zoom:.55;max-width:900px;max-height:70vh}   /* pop-ups: smaller so they fit the TV screen */
html.tv .mc{min-height:0}
html.tv .mc .n{font-size:15px}
html.tv .mc .e{font-size:13px}
.bnav .tvonly{display:none} html.tv .bnav .tvonly{display:flex} html.tv .bnav .notv{display:none}

/* bottom navigation (same on every Partners page) */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;background:var(--headerbg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:6px calc(var(--sr) + 6px) calc(var(--sb) + 6px) calc(var(--sl) + 6px)}
.bnav a{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;color:var(--dim);text-decoration:none;font-size:12px;font-weight:800}
.bnav a.on{color:var(--accent);background:var(--panel2)}

/* cards & rows */
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.signin{text-align:center;padding:36px 20px}
.signin h2{font:600 24px var(--display);margin:8px 0}
.signin p{color:var(--dim);max-width:34ch;margin:0 auto 16px}
.quick{display:flex;gap:8px;margin-bottom:12px}
.quick input{flex:1}
.group{margin:14px 0 6px;font:600 15px var(--display);color:var(--dim)}
.group.late{color:var(--danger)}
.row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:6px;cursor:pointer}
.row .main{flex:1;min-width:0}
.row .t{font-weight:700;overflow-wrap:anywhere}
.row .m{font-size:13px;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.done .t{text-decoration:line-through;color:var(--dim)}
.due{font-weight:800} .due.late{color:var(--danger)} .due.today{color:var(--accent)}
.check{flex:none;width:28px;height:28px;min-height:0;padding:0;border-radius:50%;border:2px solid var(--accent);background:transparent;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px}
.check.on{background:var(--accent)}
.starbtn{flex:none;background:transparent;min-height:0;padding:6px;font-size:20px;color:var(--dim)}
.starbtn.on{color:var(--star)}
.who{flex:none;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;background:var(--accent)}
.who.p2{background:var(--lilac)} .who.both{background:linear-gradient(135deg,var(--accent) 50%,var(--lilac) 50%)}
.empty{text-align:center;color:var(--dim);padding:40px 16px}
.empty h3{font:600 20px var(--display);color:var(--text);margin:6px 0}

/* calendar */
.calbar{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.calbar .ttl{flex:1;font:600 20px var(--display);min-width:120px}
.seg{display:inline-flex;background:var(--panel2);border-radius:12px;padding:3px}
.seg button{min-height:34px;padding:4px 10px;font-size:14px;background:transparent;border-radius:10px}
.seg button.on{background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.day{margin-bottom:12px}
.dayh{display:flex;align-items:baseline;gap:8px;font:600 16px var(--display);margin:4px 2px 6px}
.dayh .d{color:var(--dim);font-size:14px;font-family:inherit;font-weight:700}
.dayh.today{color:var(--accent)}
.ev{display:flex;gap:10px;align-items:stretch;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:6px;cursor:pointer}
.ev .bar{width:5px;border-radius:3px;flex:none;background:var(--c,var(--accent))}
.ev .tm{flex:none;width:68px;font-size:13px;color:var(--dim);font-weight:800}
.ev .t{font-weight:700}
.ev .m{font-size:13px;color:var(--dim)}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.month .hd{font-size:12px;color:var(--dim);text-align:center;font-weight:800;padding:4px 0}
.mc{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:74px;padding:3px;cursor:pointer;overflow:hidden}
.mc.out{opacity:.45}
.mc .n{font-size:13px;font-weight:800;display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;border-radius:50%}
.mc.today .n{background:var(--accent);color:#fff}
.mc .e{font-size:11px;line-height:1.25;border-radius:5px;padding:1px 4px;margin-top:2px;background:var(--c,var(--accent));color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc .e.task{background:transparent;color:var(--text);border:1px dashed var(--line)}
.mc .more{font-size:11px;color:var(--dim)}
@media (max-width:480px){ .mc{min-height:56px} .mc .e{font-size:0;height:6px;padding:0;margin-top:2px} }

/* links */
.search{margin-bottom:10px}
.diag{font-size:12px!important;color:var(--dim);margin-top:12px!important;word-break:break-word}
.scanlist{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.srow{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border-radius:12px;padding:10px}
.srow.dupe{opacity:.6}
.srow > input[type=checkbox]{width:22px;height:22px;margin-top:8px;flex:none;accent-color:var(--accent)}
.sfields{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.sline{display:flex;gap:6px} .sline > *{min-width:0}
.sline input,.sline select{font:inherit;font-size:15px;padding:7px 9px;border-radius:10px;border:1px solid var(--line);background:var(--inputbg,#fff);color:var(--text);flex:1}
.sline .samt{flex:none;width:96px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.snote{font-size:12px;color:var(--dim);font-weight:700}
.fuelctl{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.fuelctl input{font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--inputbg,#fff);color:var(--text)}
.bigbtn{min-height:56px;font-size:18px}
.fmeta{font-size:12px;color:var(--dim);font-weight:700;margin:2px 2px 8px}
.fuelrow{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px;display:flex;flex-direction:column;gap:10px}
.fuelrow.best{border:2px solid var(--accent)}
.frow1{display:flex;gap:12px;align-items:flex-start}
.fprice{flex:none;min-width:86px;text-align:center}
.fprice .pv{font:600 30px var(--display);font-variant-numeric:tabular-nums;color:var(--accent)}
.fuelrow:not(.best) .fprice .pv{color:var(--text)}
.fprice .pu{font-size:11px;color:var(--dim);font-weight:700}
.fmid{flex:1;min-width:0}
.fmid .t{font-weight:800} .fmid .m{font-size:13px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amen{font-size:13px;font-weight:700;margin-top:3px}
.rvline{font-size:13px;font-weight:700;margin-top:4px;color:var(--dim);white-space:normal}
.rvline.yes{color:var(--accent)} .rvline .rvlink{font-weight:800}
.fsave{font-size:13px;font-weight:800;color:var(--accent);margin-top:2px}
.fnote2{font-size:12px;color:var(--dim);margin:14px 2px;display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.tankin{width:56px;font:inherit;font-size:13px;padding:2px 6px;border-radius:8px;border:1px solid var(--line);background:var(--inputbg,#fff);color:var(--text)}
.sugg{display:block;width:100%;text-align:left;font-weight:600;line-height:1.4;background:var(--panel2);border-radius:12px;padding:10px 12px;margin-top:8px;white-space:pre-wrap}
.sugg small{display:block;color:var(--dim);font-weight:700;margin-top:4px;font-size:12px}
.card.pause{border:2px solid var(--lilac)} .card.pause .pt{font:600 20px var(--display)}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 8px}
.moods button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:12px;min-height:64px}
.moods button span{font-size:26px} .moods button small{font-size:11px;font-weight:800;color:var(--dim)}
.moods button.on{background:var(--text);color:var(--bg)} .moods button.on small{color:var(--bg)}
textarea.ta{width:100%;box-sizing:border-box;font:inherit;font-size:15px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--inputbg,#fff);color:var(--text);margin-bottom:8px;resize:vertical}
.twoci{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ci{background:var(--panel2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.ci.wait{align-items:center;justify-content:center;color:var(--dim);font-weight:700;text-align:center}
.cim{font-size:30px} .ciw{font-weight:800;font-size:13px;color:var(--dim)} .cia,.cin{line-height:1.35}
.card.concern{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line)}
.card.concern.s-shared,.card.concern.s-heard,.card.concern.s-proposed{border:2px solid var(--lilac)}
.cquote{font-weight:700;line-height:1.45;font-size:16px;background:var(--panel2);border-radius:12px;padding:10px 12px}
.cline{font-size:14px;line-height:1.4} .cline.heard{color:var(--text)} .cline.step{font-weight:800}
.csteps{display:flex;gap:4px;flex-wrap:wrap} .csteps span{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--panel2);color:var(--dim)}
.csteps span.on{background:var(--accent);color:#fff}
.cbtns{display:flex;gap:8px;flex-wrap:wrap} .cbtns button{flex:1;min-width:140px}
.cwarn{background:var(--panel2);border-radius:12px;padding:8px 10px;font-size:13px;display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.cprev{font-size:14px;font-style:italic;color:var(--dim);margin:10px 0}
.cwhy{background:var(--panel2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:14px;margin:10px 0}
.feelchips{margin-bottom:8px}
.aibtn{width:100%;margin:2px 0 8px;background:var(--panel2);border:1px dashed var(--lilac);font-weight:800}
.aibox{display:flex;flex-direction:column;gap:6px;margin-bottom:10px} .aibox .aiu{line-height:1.45;margin:0}
.safety{background:var(--panel2);border-left:4px solid var(--lilac);padding:8px 10px;border-radius:8px;font-weight:700}
.ustools{display:grid;grid-template-columns:1fr;gap:8px;margin:10px 0}
@media (min-width:560px){.ustools{grid-template-columns:1fr 1fr}}
.ustools.solo{grid-template-columns:1fr}
.ustool{display:flex;gap:12px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;width:100%}
.ue{font-size:24px;flex:none} .ustool small,.wkrow small{display:block;color:var(--dim);font-weight:600;font-size:13px}
.unote{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 44px 10px 12px;margin-bottom:6px}
.unote.mine{background:var(--panel2)} .unote .ut{font-weight:700;line-height:1.4} .unote .um{font-size:12px;color:var(--dim);font-weight:700;margin-top:4px}
.unote .heart{position:absolute;right:6px;top:6px;min-height:34px;padding:4px 8px;background:none;font-size:18px}
.pastci{display:flex;gap:10px;align-items:baseline;font-size:14px;padding:6px 2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pastci span:first-child{font-weight:800;min-width:52px}
.talkcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:6px;display:flex;flex-direction:column;gap:6px}
.talkbar{display:flex;height:26px;border-radius:8px;overflow:hidden;background:var(--panel2)}
.talkbar span{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden}
.talkbar .s0{background:var(--accent)} .talkbar .s1{background:var(--lilac)}
.talkst{font-size:12px;color:var(--dim);font-weight:700}
.card.support a.blk{display:block;font-weight:800;margin:6px 0}
.talkwho{font-weight:800;text-align:center;margin-top:12px} .talkclock{font:600 56px var(--display);text-align:center;font-variant-numeric:tabular-nums}
.talktips{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--dim);margin:10px 0}
.wk{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.wkrow{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border-radius:12px;padding:10px}
.wkrow input{width:22px;height:22px;margin-top:4px;accent-color:var(--accent);flex:none}
a.linkbtn{display:block;text-align:center;text-decoration:none;padding:13px;border-radius:14px;color:#fff;font-weight:800;background:var(--accent)}
.findfl{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.findfl > span:first-child{font-size:24px} .findfl small{display:block;color:var(--dim);font-weight:600;font-size:13px}
.flight{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px;display:flex;flex-direction:column;gap:8px}
.flight.past{opacity:.6}
.ftop{display:flex;align-items:center;gap:8px}
.fcode{font-weight:800;flex:1}
.fbadge{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--panel2);color:var(--dim)}
.fbadge.soon{background:var(--accent);color:#fff} .fbadge.live{background:var(--lilac);color:#fff}
.froute{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.froute .ap{font:600 30px var(--display);letter-spacing:.02em}
.froute .tm{font-size:14px;color:var(--dim);font-weight:700}
.froute .line{color:var(--accent);font-size:20px}
.finfo{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--dim);font-weight:700;align-items:center}
.finfo .conf{min-height:28px;padding:2px 10px;font-size:13px;border-radius:999px;font-family:ui-monospace,Menlo,monospace}
.fnote{font-size:13px;color:var(--dim)}
.facts{display:flex;gap:6px;flex-wrap:wrap}
.facts a,.facts button{flex:1;min-width:0;white-space:nowrap;text-align:center;min-height:36px;padding:7px 8px;border-radius:10px;font-size:13px;font-weight:800;background:var(--panel2);color:var(--text);text-decoration:none}
textarea.paste{width:100%;min-height:150px;box-sizing:border-box;font:inherit;font-size:14px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--inputbg,#fff);color:var(--text)}
.fprev{font-size:14px;font-weight:700;padding:8px 10px;background:var(--panel2);border-radius:10px;margin-top:6px}

.balance .bt{font-weight:800;color:var(--dim)}

.balance.iowe .ba{color:var(--lilac)}
.balance.even .bt{font:600 22px var(--display);color:var(--text)}
.balance button{margin-top:6px;min-width:160px}
.msum{font-size:13px;color:var(--dim);font-weight:700;margin:2px 2px 8px}
.mhead{font-weight:800;font-size:14px;margin:14px 2px 6px;color:var(--dim)}
.exp{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:6px;font-weight:500}
.exp .ic2{font-size:22px;flex:none;width:30px;text-align:center}
.exp .mid{flex:1;min-width:0;display:flex;flex-direction:column}
.exp .t{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exp .m{font-size:13px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exp .amt{flex:none;display:flex;flex-direction:column;align-items:flex-end}
.exp .a{font-weight:800;font-variant-numeric:tabular-nums}
.exp .o{font-size:12px;font-weight:800}
.exp .o.plus{color:var(--accent)} .exp .o.minus{color:var(--lilac)}
.bigamt{font-size:28px!important;font-weight:800;font-variant-numeric:tabular-nums}
.catchips{display:flex;flex-wrap:wrap;gap:6px}
.catchips button{min-height:34px;padding:4px 10px;border-radius:999px;font-size:14px}
.catchips button.on{background:var(--text);color:var(--bg)}
.seg.wide{display:flex;width:100%} .seg.wide button{flex:1}
.owep{font-weight:800;color:var(--text)!important;margin-top:10px!important}
.lnk{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:6px}
.lnk img{width:32px;height:32px;border-radius:8px;flex:none;background:var(--panel2)}
.lnk a.main{flex:1;min-width:0;text-decoration:none;color:var(--text)}
.lnk .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnk .m{font-size:13px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* sheets */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(40,16,40,.45);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.scrim{align-items:center}}
.sheet{background:var(--panel);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(var(--sb) + 16px);max-height:90vh;overflow:auto}
@media (min-width:700px){.sheet{border-radius:20px}}
.sheet h3{margin:0 0 8px;font:600 21px var(--display)}
.sheet p{margin:6px 0 12px;color:var(--dim);font-size:14px}
.sheet label.f{display:block;font-size:13px;color:var(--dim);margin:12px 0 4px;font-weight:700}
.sheet .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet .stack{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.sheet .btns{display:flex;gap:8px;margin-top:16px}
.sheet .btns button{flex:1}
.checkrow{display:flex;align-items:center;gap:10px;padding:8px 2px;font-weight:700}
.checkrow input{width:22px;height:22px;accent-color:var(--accent)}
.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{min-height:36px;padding:6px 12px;font-size:14px}
.pills button.on{background:var(--accent);color:#fff}
.themepick{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:62px;min-height:62px;border-radius:16px;padding:0;display:flex;align-items:flex-end;justify-content:center;font-size:11px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);padding-bottom:4px}
.swatch.on{outline:3px solid var(--ring,var(--accent));outline-offset:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 84px);z-index:40;background:var(--text);color:var(--bg);font-weight:700;
  padding:10px 16px;border-radius:12px;font-size:14px;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.25);text-align:center}
.spin{color:var(--dim);text-align:center;padding:24px}
/* tasks, Google Tasks style */
.gt-phone{display:flex;flex-direction:column;gap:10px}
.gt-who{display:flex;gap:6px}
.gt-who button{min-height:32px;padding:4px 12px;font-size:13px;border-radius:999px;background:transparent;border:1px solid var(--line);color:var(--dim)}

.gt-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px 0 8px;box-shadow:0 1px 2px rgba(60,20,50,.06)}
.gt-card>header{position:static;display:flex;align-items:center;gap:6px;padding:8px 6px 4px 18px;background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none}

.gt-priv{flex:none;font-size:12px;font-weight:800;color:var(--dim);background:var(--panel2);border-radius:999px;padding:2px 9px}
.gt-gwarn{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:var(--panel2);border:1px dashed var(--accent);border-radius:12px;padding:8px 12px;margin:4px 0 8px}
.gt-gwarn small{font-weight:600;color:var(--dim);font-size:12px}
.gt-gstat{font-size:12px;color:var(--dim);font-weight:700;padding:0 12px 6px 24px;margin-left:-12px}

.gt-gphone{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}

.gt-dots:hover,.gt-dbtn:hover{background:var(--panel2)}
.gt-add{display:flex;align-items:center;gap:14px;width:100%;background:transparent;border-radius:0;padding:8px 18px;min-height:44px;color:var(--accent);font-weight:700;text-align:left}
.gt-add:hover{background:var(--panel2)}
.gt-plus{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:20px;line-height:1}

<script>
'use strict';
/* ================= basics ================= */
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseYmd = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone;
const fmtDay = d => d.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
const fmtShort = d => d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
const fmtTime = d => d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
function dueLabel(t){
  if(!t.due) return null;
  const d=parseYmd(t.due), diff=Math.round((d-today())/86400000);
  let s = diff===0?'Today':diff===1?'Tomorrow':diff===-1?'Yesterday':(diff>1&&diff<7)?d.toLocaleDateString(undefined,{weekday:'long'}):fmtShort(d);
  if(t.time){ const [h,m]=t.time.split(':').map(Number); const x=new Date(d); x.setHours(h,m); s+=' '+fmtTime(x); }
  return {s, cls: t.done?'':diff<0?'late':diff===0?'today':''};
}
function sheet(build){ return new Promise(resolve=>{
  const scrim=el('div',{className:'scrim'}), sh=el('div',{className:'sheet'}); scrim.append(sh);
  const close=v=>{ scrim.remove(); resolve(v); };
  scrim.onclick=e=>{ if(e.target===scrim) close(null); };
  build(sh, close); document.body.append(scrim);
  const f=sh.querySelector('[autofocus]'); if(f) setTimeout(()=>f.focus(),50);
}); }
const field=(label,input)=>[el('label',{className:'f',textContent:label}),input];
function addTips(root){ root.querySelectorAll('button:not([title]),a:not([title])').forEach(b=>{ const t=(b.getAttribute('aria-label')||b.textContent||'').replace(/\s+/g,' ').trim(); if(t) b.title=t; }); }
new MutationObserver(()=>addTips(document)).observe(document.body,{childList:true,subtree:true});

/* ================= people ================= */
let members=[];
const me = () => acct.me || {};
const partner = () => members.find(m=>m.email!==me().email) || null;
const nameOf = email => email==='both' ? 'Both of you' : (members.find(m=>m.email===email)||{}).name || (email||'').split('@')[0] || 'Anyone';
function whoBubble(a){
  if(!a) return null;
  const both=a==='both', p2=!both && a!==me().email;
  const col=!both && (members.find(m=>m.email===a)||{}).color;
  return el('span',{className:'who'+(both?' both':p2?' p2':''),style:col?`background:${col}`:'',textContent:both?'∞':(nameOf(a)[0]||'?').toUpperCase(),title:both?'Both of you':nameOf(a)});
}

/* ================= shared data (tasks, links) ================= */
const store = {
  tasks: { items:[], lists:[], v:0 },
  links: { items:[], lists:[], v:0 },
  expenses: { items:[], lists:[], v:0 },
  flights: { items:[], lists:[], v:0 },
  us: { items:[], lists:[], v:0 },
};
const pending = { tasks: [], links: [], expenses: [], flights: [], us: [] };
// A partner's private task lists never show here (the relay doesn't send them either).
function scrub(k,doc){ if(k!=='tasks'||!doc) return doc; const em=me().email;
  const hide=new Set((doc.lists||[]).filter(l=>l.private&&l.owner&&l.owner!==em).map(l=>l.id)); if(!hide.size) return doc;
  return {...doc,lists:doc.lists.filter(l=>!hide.has(l.id)),items:(doc.items||[]).filter(t=>!hide.has(t.list))}; }
function loadCache(){ for(const k of ['tasks','links','expenses','flights','us']){ try{ const c=JSON.parse(localStorage.getItem('partners.cache.'+k)||'null'); if(c) store[k]=scrub(k,c); const p=JSON.parse(localStorage.getItem('partners.pending.'+k)||'[]'); pending[k]=p; }catch(_){} } }
function saveCache(k){ try{ localStorage.setItem('partners.cache.'+k, JSON.stringify(store[k])); localStorage.setItem('partners.pending.'+k, JSON.stringify(pending[k])); }catch(_){} }
function applyLocal(doc, op){
  const coll = op.kind==='list' ? doc.lists : doc.items;
  if(op.op==='upsert'){ const i=coll.findIndex(x=>x.id===op.item.id); if(i<0) coll.push({createdAt:Date.now(),createdBy:me().email,...op.item}); else coll[i]={...coll[i],...op.item}; }
  if(op.op==='delete'){ const i=coll.findIndex(x=>x.id===op.id); if(i>=0) coll.splice(i,1); }
}
async function change(k, ops){
  if(k==='tasks' && !gApplying){ const add={};   // deleting a task that's also in Google Tasks: remember to delete it there
    ops.forEach(o=>{ if(o.op!=='delete'||o.kind) return; const it=store.tasks.items.find(x=>x.id===o.id); if(!it||!it.gtid) return;
      const L=store.tasks.lists.find(l=>l.id===(it.list||'')&&gOn(l)); if(L) (add[L.id]=add[L.id]||[]).push(it.gtid); });
    Object.entries(add).forEach(([id,g])=>{ const L=store.tasks.lists.find(l=>l.id===id); if(!ops.some(o=>o.kind==='list'&&o.op==='delete'&&o.id===id)) ops.push({op:'upsert',kind:'list',item:{...L,gdel:[...(L.gdel||[]),...g]}}); }); }
  if(k==='tasks' && !gApplying) ops=ops.map(o=>o.item&&!o.kind?{...o,item:{...o.item,gdirty:true}}:o);
  ops=ops.map(o=>o.item?{...o,item:{...o.item,updatedAt:Date.now(),updatedBy:me().email}}:o);
  ops.forEach(o=>applyLocal(store[k],o)); pending[k].push(...ops); saveCache(k); render();

function tDraggable(r,t){

    document.querySelectorAll('.gt-drop').forEach(x=>x.classList.remove('gt-drop','after'));

    else if(list){ list.classList.add('gt-drop'); drag.target={list:list.dataset.list}; } };
  const end=()=>{ clearTimeout(timer); timer=null; if(!drag) return; const d=drag; drag=null; d.ghost.remove(); r.classList.remove('gt-dragging');
    document.querySelectorAll('.gt-drop').forEach(x=>x.classList.remove('gt-drop','after'));

    if(!d.target) return; const listId=d.target.list||'';

function nextDue(t){
  const d=parseYmd(t.due||ymd(today()));
  if(t.repeat==='daily') d.setDate(d.getDate()+1);
  else if(t.repeat==='weekdays'){ do{ d.setDate(d.getDate()+1); }while([0,6].includes(d.getDay())); }
  else if(t.repeat==='weekly') d.setDate(d.getDate()+7);
  else if(t.repeat==='monthly') d.setMonth(d.getMonth()+1);
  else if(t.repeat==='yearly') d.setFullYear(d.getFullYear()+1);
  return ymd(d);
}
// Completing a task completes its subtasks too (as in Google Tasks). Repeating tasks move to their next date.
function toggleDone(t){
  if(!t.done && t.repeat){ const n=nextDue(t); change('tasks',[{op:'upsert',item:{...t,due:n,lastDone:Date.now()}}]); toast(`Done ✓ Next one: ${fmtShort(parseYmd(n))}`); return; }
  const now=Date.now(), ops=[{op:'upsert',item:{...t,done:!t.done,doneAt:t.done?null:now,doneBy:t.done?null:me().email}}];
  if(!t.done) tItems().filter(x=>x.parent===t.id&&!x.done).forEach(k=>ops.push({op:'upsert',item:{...k,done:true,doneAt:now,doneBy:me().email}}));
  if(t.done && t.parent){ const par=tItems().find(x=>x.id===t.parent); if(par&&par.done) ops.push({op:'upsert',item:{...par,done:false,doneAt:null,doneBy:null}}); }

}

async function importGoogleTasks(){
  let lists;
  try{ lists=(await gapi('https://tasks.googleapis.com/tasks/v1/users/@me/lists?maxResults=100')).items||[]; }
  catch(e){ return toast(e.status===403?'Google Tasks isn’t turned on for Partners yet (see setup steps), or you need to sign in again.':'Could not reach Google Tasks: '+e.message,6000); }
  if(!lists.length) return toast('No Google Tasks lists found');
  const pn=partner()?partner().name:'your partner';
  const chosen=await sheet((sh,close)=>{
    sh.append(el('h3',{textContent:'Bring in Google Tasks'}),el('p',{textContent:'Pick the lists to bring into Partners. They keep Google’s order and subtasks. Doing this again updates tasks already brought in (order, subtasks, details) and adds new ones. Nothing is deleted.'}));
    const all=el('input',{type:'checkbox',checked:true}); sh.append(el('label',{className:'checkrow'},all,el('b',{textContent:'All lists'})));
    const boxes=lists.map(l=>{ const had=store.tasks.lists.find(x=>x.gtlid===l.id||x.name.toLowerCase()===l.title.toLowerCase());
      const i=el('input',{type:'checkbox',checked:true}); sh.append(el('label',{className:'checkrow'},i,l.title+(had?'  (update)':''))); return [l,i]; });
    all.onchange=()=>boxes.forEach(b=>b[1].checked=all.checked);
    const comp=el('input',{type:'checkbox'}); sh.append(el('label',{className:'checkrow'},comp,'Also bring in completed tasks'));
    let shared=false; const who=el('div',{className:'pills'});
    const draw=()=>who.replaceChildren(...[[false,'🔒 Just me'],[true,`👥 Share with ${pn}`]].map(([v,l])=>{ const b=el('button',{type:'button',className:shared===v?'on':'',textContent:l}); b.onclick=()=>{ shared=v; draw(); }; return b; })); draw();
    sh.append(el('label',{className:'f',textContent:'Who can see these lists'}),who,el('p',{textContent:'You can share single lists later from each list’s ⋮ menu.'}));
    const go=el('button',{className:'primary',textContent:'Bring them in',title:'Import the chosen lists'}); go.onclick=()=>close({lists:boxes.filter(b=>b[1].checked).map(b=>b[0]),completed:comp.checked,shared});
    const c=el('button',{className:'ghost',textContent:'Cancel'}); c.onclick=()=>close(null);
    sh.append(el('div',{className:'btns'},c,go));
  });
  if(!chosen || !chosen.lists.length) return;
  toast('Bringing in your Google Tasks…',60000);
  const byG={}; store.tasks.items.forEach(t=>{ if(t.gtid) byG[t.gtid]=t; });
  const ops=[]; let added=0, updated=0;
  for(const gl of chosen.lists){
    const gi=lists.indexOf(gl);
    let L=store.tasks.lists.find(l=>l.gtlid===gl.id)||store.tasks.lists.find(l=>l.name.toLowerCase()===gl.title.toLowerCase());
    const share={private:!chosen.shared,owner:chosen.shared?null:me().email};
    if(!L){ L={id:uid(),name:gl.title,sort:'my'}; store.tasks.lists.push(L); }
    L={...L,gtlid:gl.id,gname:gl.title,gsync:true,gowner:me().email,order:gi,...share}; ops.push({op:'upsert',kind:'list',item:L});
    let pageToken=''; const got=[];
    do{
      const q=new URLSearchParams({maxResults:'100',showCompleted:String(chosen.completed),showHidden:String(chosen.completed)}); if(pageToken) q.set('pageToken',pageToken);
      const d=await gapi(`https://tasks.googleapis.com/tasks/v1/lists/${encodeURIComponent(gl.id)}/tasks?${q}`);
      for(const gt of d.items||[]) if(gt.title) got.push(gt);
      pageToken=d.nextPageToken||'';
    }while(pageToken);
    // Google's own order: "position" sorts tasks among their siblings.
    got.sort((a,b)=>String(a.position||'').localeCompare(String(b.position||'')));
    const idOf={}; got.forEach(gt=>idOf[gt.id]=(byG[gt.id]||{}).id||uid());
    got.forEach((gt,i)=>{ const done=gt.status==='completed', old=byG[gt.id];
      const links=(gt.links||[]).map(x=>x.link).filter(u=>u&&!(gt.notes||'').includes(u));
      const notes=[gt.notes||'',...links].filter(Boolean).join('\n');
      const parent=gt.parent&&idOf[gt.parent]?idOf[gt.parent]:null;
      const gs={glist:gl.id,gupd:gt.updated,gdirty:false};
      if(old){ ops.push({op:'upsert',item:{...old,...gs,list:L.id,parent,order:i,notes:old.notes||notes,assignee:L.private&&old.assignee&&old.assignee!==me().email?'':old.assignee}}); updated++; return; }
      ops.push({op:'upsert',item:{...gs,id:idOf[gt.id],gtid:gt.id,title:gt.title,notes,due:gt.due?gt.due.slice(0,10):null,time:null,list:L.id,parent,order:i,
        assignee:me().email,done,doneAt:done?Date.parse(gt.completed)||Date.now():null,doneBy:done?me().email:null,important:false,repeat:''}}); added++; });
  }
  ops.forEach(o=>{ if(o.item&&o.item.gtid) o.item.gdirty=false; });
  gApplying=true; try{ await change('tasks',ops); }finally{ gApplying=false; }
  gLast=Date.now(); tset('gsyncAt',gLast); render();
  toast(`Done: ${added} new task${added===1?'':'s'}${updated?`, ${updated} updated`:''} from Google Tasks`,5000);
}

/* ---- two-way sync with Google Tasks ----
   Lists brought in from Google (or made with "Keep in Google Tasks") stay in step with Google Tasks both ways:
   new tasks, edits, done/undone, deletes, subtasks, order and moves between lists. It runs on the phone or computer
   of the person who linked the list (it uses their Google sign-in), every few minutes while Partners is open. */
const G_TL='https://tasks.googleapis.com/tasks/v1';
const PARTNERS_VER='125';
let gSyncing=false, gNeedScope=false, gApplying=false, gKickT=null, gLastErr='';
let gLast=+tget('gsyncAt',0)||0;
const gDirty=t=>!!t.gdirty;   // changed in Partners since the last sync
const gDue=d=>d?d+'T00:00:00.000Z':null;
// Lists brought in from Google before sync existed have a Google id but no on/off setting yet: they sync too.
const gOn=l=>!l.removed&&(l.gsync===true||(l.gsync===undefined&&!!l.gtlid));
const gMine=()=>store.tasks.lists.filter(l=>gOn(l) && (l.gowner||l.owner||l.createdBy||me().email)===me().email);
// Can Partners change this person's Google Tasks? (Older sign-ins could only read them.)
let gScopeChecked=false;
let gScopeMsg='';
async function gCheckScope(force){ if((gScopeChecked&&!force)||!acct.session) return; gScopeChecked=true; gScopeMsg='Checking your Google connection…';
  try{ const t=await googleAccess();   // ask Google itself what this sign-in may do
    const r=await fetch('https://www.googleapis.com/oauth2/v3/tokeninfo?access_token='+encodeURIComponent(t)); const d=await r.json().catch(()=>({}));
    if(!r.ok){ localStorage.removeItem('partners.gtoken'); throw new Error(d.error_description||'Google didn’t accept the sign-in'); }
    const can=/auth\/tasks(\s|$)/.test(d.scope||''); gNeedScope=!can; gScopeMsg=can?'✓ Partners can update your Google Tasks':'Partners can only read your Google Tasks right now'; }
  catch(e){ gNeedScope=true; gScopeMsg='Google isn’t connected: '+(e.message||e); }

function flightBadge(f){
  const now=Date.now(), a=fWhen(f).getTime(), b=fLand(f).getTime();

  if(days<=0){ const h=Math.max(0,Math.round((a-now)/36e5)); return ['soon', h<1?'Leaving soon':`In ${h} hour${h>1?'s':''}`]; }

/* ---------- Concerns: raise a complaint gently, and make sure it's understood before solving it ----------
   Steps: 1 share it (what happened · how I felt · what I'd like) → 2 the partner says back what they heard
   → 3 the one who raised it confirms "yes, that's it" (or clarifies) → 4 one small step, agreed by both
   → 5 "It's better now". Each feeling comes with the need usually behind it, to help the listener understand. */
const FEELINGS=[
  ['hurt','💔','Hurt','to feel cared for'],
  ['lonely','🫥','Lonely','closeness and time together'],
  ['unappreciated','🙁','Unappreciated','to feel noticed and valued'],
  ['overwhelmed','😵‍💫','Overwhelmed','help, and a fair share of the load'],
  ['frustrated','😤','Frustrated','for this to change, and to be taken seriously'],
  ['ignored','🙉','Not listened to','to be heard'],
  ['worried','😟','Worried','reassurance and a plan'],
  ['anxious','😰','Anxious','calm and knowing what to expect'],
  ['disrespected','😠','Disrespected','respect, and to be treated as an equal'],
  ['embarrassed','😳','Embarrassed','to feel safe and backed up in front of others'],
  ['disappointed','😞','Disappointed','to be able to count on you'],
  ['tired','🥱','Worn out','rest and support'],
];
const feelOf=k=>FEELINGS.find(f=>f[0]===k)||[k,'💬',k,''];
const feelList=ks=>{ const n=(ks||[]).map(k=>feelOf(k)[2].toLowerCase()); return n.length<2?(n[0]||''):n.slice(0,-1).join(', ')+' and '+n[n.length-1]; };
const SIZES=[['small','A small thing'],['medium','It matters'],['big','It’s big for me']];
const WHENS=[['now','Now is fine'],['today','Later today'],['soon','In the next few days']];
const concerns=()=>usItems('concern').filter(x=>x.status!=='withdrawn');
const concernBy=c=>c.by||c.createdBy;
function concernText(c){ const clean=t=>String(t||'').trim().replace(/[.!\s]+$/,'');
  const ab=clean(c.about).replace(/^when\s+/i,''), f=feelList(c.feelings), nd=clean(c.need).replace(/^(i’d like|i'd like|i would like)\s+/i,'');
  let t = ab ? (f ? `When ${ab}, I felt ${f}.` : `When ${ab}.`) : (f ? `I felt ${f}.` : '');
  if(nd) t += (t?' ':'')+`I’d like ${nd}.`;
  return t; }
// Claude's help for concerns (through the relay). Only the text of this concern is sent.
async function concernAI(mode, extra){ const p=partner();
  try{ return await partnersApi('concern-ai',{method:'POST',body:JSON.stringify({mode, partner:(p&&p.name)||'', feelingKeys:FEELINGS.map(f=>f[0]), ...extra})}); }
  catch(e){ throw new Error(e.status===404?'Claude’s help needs the relay update first (see the checklist).':e.message); } }
const concernPayload=c=>({about:c.about, feelings:(c.feelings||[]).map(k=>feelOf(k)[2]), need:c.need, clarify:c.clarify||'', heard:c.heard?c.heard.text:'', side:c.side?c.side.text:''});
function aiBox(){ return el('div',{className:'aibox hidden'}); }
function aiShow(box, nodes){ box.replaceChildren(...nodes); box.classList.toggle('hidden',!nodes.length); }
function aiBusy(btn, on, label){ btn.disabled=on; btn.textContent=on?'✨ Thinking…':label; }
function useBtn(text, fn){ const b=el('button',{type:'button',className:'sugg'}); b.append(text, el('small',{textContent:'Tap to use'})); b.onclick=fn; return b; }
function concernSave(c, patch, entry){ const log=(c.log||[]).slice(); if(entry) log.push({...entry, by:me().email, at:Date.now()});
  return change('us',[{op:'upsert',item:{...c, ...patch, log}}]); }

// Words that usually turn a complaint into criticism, with a gentler idea.
function criticismHints(t){ const s=' '+t.toLowerCase()+' ', out=[];
  if(/\b(always|never)\b/.test(s)) out.push('“Always” and “never” can sound like an attack. Try one specific time it happened.');
  if(/\byou('re| are) (so |such |really )?(a |an )?(lazy|selfish|useless|stupid|rude|mean|inconsiderate|thoughtless|careless|crazy|impossible|ridiculous|liar)/.test(s)) out.push('Describing who they are feels like blame. Describe what happened instead.');
  if(/\bwhy (do|don’t|don't|can’t|can't|won’t|won't) you\b/.test(s)) out.push('“Why don’t you…” can sound like an accusation. Try “I’d like…”.');
  if(/\b(whatever|i don’t care|i don't care|obviously|seriously\?)/.test(s)) out.push('That can come across as dismissive. Say what you feel instead.');
  return out; }

async function raiseConcern(edit){
  const p=partner(), pn=(p&&p.name)||'your partner';
  const st={feelings:new Set(edit?edit.feelings:[]), size:(edit&&edit.size)||'medium', when:(edit&&edit.when)||'today'};
  await sheet((sh,close)=>{
    sh.append(el('h3',{textContent:'💬 Share a concern'}),
      el('p',{className:'hint',textContent:`Talk about one situation, how it felt, and what would help. ${pn} sees it in Us and says back what they heard before anyone tries to fix anything.`}));
    const vent=el('textarea',{className:'ta',rows:3,placeholder:'Not sure how to say it? Write it however it comes out. Messy or angry is fine.'});
    const shape=el('button',{type:'button',className:'aibtn',textContent:'✨ Shape it for me'}), sout=aiBox();
    const about=el('textarea',{className:'ta',rows:3,placeholder:'What happened? One specific time, e.g. “When plans changed last night and I found out at the last minute…”',value:(edit&&edit.about)||''});
    const warn=el('div',{className:'cwarn hidden'});
    const chips=el('div',{className:'catchips feelchips'});
    FEELINGS.forEach(([k,e,l])=>{ const b=el('button',{type:'button',textContent:`${e} ${l}`,className:st.feelings.has(k)?'on':''}); b.dataset.k=k; b.onclick=()=>{ st.feelings.has(k)?st.feelings.delete(k):st.feelings.add(k); b.classList.toggle('on',st.feelings.has(k)); prev(); }; chips.append(b); });
    const need=el('textarea',{className:'ta',rows:2,placeholder:'What would help? e.g. “a heads-up text when plans change”',value:(edit&&edit.need)||''});
    const seg=(opts,key)=>{ const s=el('div',{className:'seg wide'}); opts.forEach(([k,l])=>{ const b=el('button',{type:'button',textContent:l,className:st[key]===k?'on':''}); b.onclick=()=>{ st[key]=k; s.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); }; s.append(b); }); return s; };
    const preview=el('div',{className:'cprev'});
    const prev=()=>{ const t=concernText({about:about.value.trim(), feelings:[...st.feelings], need:need.value.trim()});
      preview.textContent=t?`${pn} will read: “${t}”`:''; preview.classList.toggle('hidden',!t);
      const h=criticismHints(about.value+' '+need.value); warn.replaceChildren(...h.map(x=>el('div',{textContent:'💡 '+x}))); warn.classList.toggle('hidden',!h.length); };
    about.oninput=prev; need.oninput=prev;
    shape.onclick=async()=>{ const t=vent.value.trim(); if(!t) return vent.focus(); aiBusy(shape,true);
      try{ const d=await concernAI('shape',{text:t});
        if(d.about) about.value=d.about; if(d.need) need.value=d.need;
        if(d.feelings && d.feelings.length){ st.feelings=new Set(d.feelings); chips.querySelectorAll('button').forEach(x=>x.classList.toggle('on',st.feelings.has(x.dataset.k))); }
        prev(); aiShow(sout,[...(d.safety?[el('p',{className:'safety',textContent:'💜 '+d.safety})]:[]), el('p',{className:'hint',textContent:'✨ Filled in below. Change anything that isn’t quite you.'+(d.tip?' 💡 '+d.tip:'')})]); }
      catch(e){ aiShow(sout,[el('p',{className:'hint',textContent:'Couldn’t get help: '+e.message})]); }
      finally{ aiBusy(shape,false,'✨ Shape it again'); } };
    const send=el('button',{className:'primary',textContent:edit?'Save':'Share with '+pn});
    send.onclick=()=>{ const a=about.value.trim(); if(!a) return about.focus(); if(!st.feelings.size) return toast('Pick at least one feeling');
      const item={about:a, feelings:[...st.feelings], need:need.value.trim(), size:st.size, when:st.when};
      if(edit) concernSave(edit,item,{type:'edit'}); else change('us',[{op:'upsert',item:{id:uid(),kind:'concern',by:me().email,status:'shared',log:[],...item}}]);
      close(); toast(edit?'Updated':'Shared 💬'); };
    const c=el('button',{className:'ghost',textContent:'Cancel'}); c.onclick=()=>close();
    sh.append(vent, shape, sout, ...field('What happened',about), warn, el('label',{className:'f',textContent:'How I felt'}), chips, ...field('What I’d like',need),
      ...field('How big is this for me?',seg(SIZES,'size')), ...field('A good time to talk',seg(WHENS,'when')), preview, el('div',{className:'btns'},c,send));
    prev();
  });
}

// The listener's turn: understand first. No defending, no fixing yet.
async function hearConcern(c){
  const who=nameOf(concernBy(c));
  await sheet((sh,close)=>{
    sh.append(el('h3',{textContent:`👂 Hear ${who} out`}),
      el('div',{className:'cquote',textContent:concernText(c)}));
    const why=el('div',{className:'cwhy'}); why.append(el('b',{textContent:'What may be underneath'}));
    (c.feelings||[]).forEach(k=>{ const f=feelOf(k); if(f[3]) why.append(el('div',{textContent:`${f[1]} Feeling ${f[2].toLowerCase()} often means needing ${f[3]}.`})); });
    if(c.size==='big') why.append(el('div',{textContent:`⚠️ ${who} said this is big for them, so take it slowly.`}));
    const tips=el('p',{className:'hint',textContent:'No defending and no fixing yet. Just show you understand. Your side and solutions come next.'});
    const help=el('button',{type:'button',className:'aibtn',textContent:'✨ Help me understand'}), hout=aiBox();
    const heard=el('textarea',{className:'ta',rows:3,placeholder:'What I heard is…'});
    const start=el('button',{type:'button',className:'ghost',textContent:'Give me a starting point'});
    start.onclick=()=>{ const f=feelList(c.feelings); heard.value=`What I heard is that when ${c.about.replace(/^when\s+/i,'').replace(/[.!\s]+$/,'')}, you felt ${f}${c.need?`, and you’d like ${c.need.replace(/[.!\s]+$/,'')}`:''}. Did I get that right?`; heard.focus(); };
    const valid=el('textarea',{className:'ta',rows:2,placeholder:'It makes sense you’d feel that way, because…'});
    const brk=el('button',{type:'button',className:'ghost',textContent:'⏸️ I need a break first'}); brk.onclick=()=>{ close(); askBreak(); };
    help.onclick=async()=>{ aiBusy(help,true);
      try{ const d=await concernAI('understand',{concern:concernPayload(c)}); const n=[];
        if(d.safety) n.push(el('p',{className:'safety',textContent:'💜 '+d.safety}));
        if(d.underneath) n.push(el('p',{className:'aiu',textContent:d.underneath}));
        if(d.reflect) n.push(el('label',{className:'f',textContent:'You could say back'}), useBtn(d.reflect,()=>{ heard.value=d.reflect; heard.focus(); }));
        if(d.validate) n.push(useBtn(d.validate,()=>{ valid.value=d.validate; }));
        if(d.ask) n.push(el('p',{className:'hint',textContent:'❓ You could ask: '+d.ask}));
        if(d.avoid && d.avoid.length) n.push(el('p',{className:'hint',textContent:'🚫 Try not to say: '+d.avoid.join(' · ')}));
        aiShow(hout,n); }
      catch(e){ aiShow(hout,[el('p',{className:'hint',textContent:'Couldn’t get help: '+e.message})]); }
      finally{ aiBusy(help,false,'✨ Ask again'); } };
    const send=el('button',{className:'primary',textContent:'Send what I heard'});
    send.onclick=()=>{ const h=heard.value.trim(); if(!h) return heard.focus();
      concernSave(c,{status:'heard', heard:{text:h, valid:valid.value.trim(), by:me().email, at:Date.now()}},{type:'heard',text:h}); close(); toast('Sent 👂'); };
    const x=el('button',{className:'ghost',textContent:'Not now'}); x.onclick=()=>close();
    sh.append(why, help, hout, tips, ...field('Say back what you heard',heard), start, ...field('Show it makes sense (optional)',valid), ...(US_ON.pause?[brk]:[]), el('div',{className:'btns'},x,send));
  });
}
async function clarifyConcern(c){
  await sheet((sh,close)=>{
    sh.append(el('h3',{textContent:'Not quite'}), el('p',{className:'hint',textContent:'Say what they missed, kindly. They’ll get another go at saying it back.'}));
    const t=el('textarea',{className:'ta',rows:3,placeholder:'The part that matters most to me is…'});
    const send=el('button',{className:'primary',textContent:'Send'}); send.onclick=()=>{ const v=t.value.trim(); if(!v) return t.focus();
      concernSave(c,{status:'shared', clarify:v, heard:null},{type:'clarify',text:v}); close(); };
    const x=el('button',{className:'ghost',textContent:'Cancel'}); x.onclick=()=>close();
    sh.append(t, el('div',{className:'btns'},x,send));
  });
}
async function mySide(c){
  await sheet((sh,close)=>{
    sh.append(el('h3',{textContent:'My side'}), el('p',{className:'hint',textContent:`Now that ${nameOf(concernBy(c))} feels heard, you can share how it looked from your side. Same idea: what happened for you, how you felt, no blame.`}));
    const t=el('textarea',{className:'ta',rows:3,placeholder:'From my side…',value:c.side?c.side.text:''});
    const kind=el('button',{type:'button',className:'aibtn',textContent:'✨ Help me say it kindly'}), kout=aiBox();
    kind.onclick=async()=>{ if(!t.value.trim()) return t.focus(); aiBusy(kind,true);
      try{ const d=await partnersApi('rephrase',{method:'POST',body:JSON.stringify({text:t.value, to:nameOf(concernBy(c))})});
        aiShow(kout,[...(d.options||[]).map(o=>useBtn(o,()=>{ t.value=o; aiShow(kout,[]); })), ...(d.tip?[el('p',{className:'hint',textContent:'💡 '+d.tip})]:[])]); }
      catch(e){ aiShow(kout,[el('p',{className:'hint',textContent:'Couldn’t get help: '+e.message})]); }
      finally{ aiBusy(kind,false,'✨ Try again'); } };
    const send=el('button',{className:'primary',textContent:'Share'}); send.onclick=()=>{ const v=t.value.trim(); if(!v) return t.focus();

function concernCard(c){

  const card=el('div',{className:'card concern s-'+c.status});

  const dots=el('div',{className:'csteps'}); ['Shared','Heard','Understood','A step','Agreed'].forEach((l,i)=>dots.append(el('span',{className:i<=at?'on':'',textContent:l})));
  const size=(SIZES.find(s=>s[0]===c.size)||[])[1], when=(WHENS.find(s=>s[0]===c.when)||[])[1];
  card.append(el('div',{className:'um',textContent:`${raiser} · ${fmtShort(new Date(c.createdAt||Date.now()))}${size?' · '+size:''}${when&&c.status==='shared'?' · '+when:''}`}),
    el('div',{className:'cquote',textContent:concernText(c)}), dots);
  if(c.clarify) card.append(el('div',{className:'cline',textContent:`${raiser==='You'?'You added':raiser+' added'}: “${c.clarify}”`}));
  if(c.heard) card.append(el('div',{className:'cline heard',textContent:`👂 ${c.heard.by===me().email?'You':nameOf(c.heard.by)}: “${c.heard.text}”${c.heard.valid?` · “${c.heard.valid}”`:''}`}));
  if(c.side) card.append(el('div',{className:'cline',textContent:`🪞 ${c.side.by===me().email?'Your':nameOf(c.side.by)+'’s'} side: “${c.side.text}”`}));
  if(c.step) card.append(el('div',{className:'cline step',textContent:`🌱 ${c.status==='agreed'?'Agreed':'Suggested'}: ${c.step.text} (${c.step.who==='both'?'both of you':c.step.who===me().email?'you':nameOf(c.step.who)})`}));
  const btns=el('div',{className:'cbtns'}), b=(t,fn,cls)=>{ const x=el('button',{className:cls||'',textContent:t}); x.onclick=fn; btns.append(x); };
  const hint=t=>card.append(el('p',{className:'hint',textContent:t}));
  if(c.status==='shared'){ if(mine){ hint(`Waiting for ${other} to say back what they heard.`); b('Edit',()=>raiseConcern(c),'ghost'); b('Let it go',()=>concernSave(c,{status:'withdrawn'},{type:'withdraw'}),'ghost'); }
    else { hint('Your turn: understand first. No defending or fixing yet.'); b('👂 Say back what I heard',()=>hearConcern(c),'primary'); } }
  if(c.status==='heard'){ if(mine){ hint('Did they get it?'); b('💚 Yes, that’s it',()=>concernSave(c,{status:'understood'},{type:'confirm'}),'primary'); b('Not quite',()=>clarifyConcern(c),'ghost'); }
    else hint(`Waiting for ${raiser} to say if you got it right.`); }
  if(c.status==='understood'){ hint(mine?`${other} understands. Now find one small step together.`:'They feel understood 💚 Now you can share your side, or suggest a step.');
    b('🌱 Suggest a step',()=>proposeStep(c),'primary'); if(!mine) b(c.side?'Edit my side':'🪞 Share my side',()=>mySide(c),'ghost'); }
  if(c.status==='proposed'){ const byMe=c.step.by===me().email;
    if(byMe){ hint('Waiting for the other person to agree.'); b('Change it',()=>proposeStep(c),'ghost'); }
    else { b('🤝 Agree',()=>agreeStep(c),'primary'); b('Suggest something else',()=>proposeStep(c),'ghost'); } }
  if(c.status==='agreed'){ if(mine){ hint('Give it a try. When it feels better, close it here.'); b('✓ It’s better now',()=>concernSave(c,{status:'resolved',resolvedAt:Date.now()},{type:'resolved'}),'primary'); b('Talk about it again',()=>concernSave(c,{status:'understood',step:null},{type:'reopen'}),'ghost'); }
    else hint(`When ${raiser} feels it’s better, they’ll close it.`); }
  if(btns.children.length) card.append(btns);
  return card;
}
function concernSection(parts){

async function talkItThrough(){
  const p=partner(), pn=(p&&p.name)||'Partner';

  await sheet((sh,close)=>{
    sh.append(el('h3',{textContent:'🗣️ Talk it through'}), el('p',{textContent:'One person speaks, the other only listens and then repeats back what they heard. Then swap. It slows things down so you both feel heard.'}));
    const topic=el('input',{placeholder:'What do you want to talk about? (one topic)'});
    const who=el('div',{className:'talkwho'}), clock=el('div',{className:'talkclock'}), tips=el('div',{className:'talktips'});
    const draw=()=>{ who.textContent=`🎤 ${st.speaker} speaks · 👂 ${st.other} listens`;
      clock.textContent=`${Math.floor(st.left/60)}:${String(st.left%60).padStart(2,'0')}`;
      tips.innerHTML=`<div><b>Speaker:</b> talk about your feelings, not their faults. “I feel… when… I’d like…” Keep it short.</div><div><b>Listener:</b> no defending or fixing yet. When time’s up, say back “What I heard is…” and ask “Did I get that right?”</div>`; };
    const startB=el('button',{className:'primary',textContent:'Start'}), swap=el('button',{textContent:'⇄ Swap'}), reset=el('button',{className:'ghost',textContent:'Reset'});
    const tick=()=>{ if(!st.run) return; st.left=Math.max(0,st.left-1); draw(); if(!st.left){ st.run=false; startB.textContent='Start'; try{ navigator.vibrate&&navigator.vibrate(300); }catch(_){} toast(`Time. ${st.other}: say back what you heard.`,5000); } };
    startB.onclick=()=>{ st.run=!st.run; startB.textContent=st.run?'Pause':'Start'; clearInterval(st.t); if(st.run) st.t=setInterval(tick,1000); };
    swap.onclick=()=>{ [st.speaker,st.other]=[st.other,st.speaker]; st.left=st.secs; st.run=false; clearInterval(st.t); startB.textContent='Start'; st.rounds++; draw(); };
    reset.onclick=()=>{ st.left=st.secs; st.run=false; clearInterval(st.t); startB.textContent='Start'; draw(); };
    const len=el('div',{className:'seg wide'}); for(const m of [1,2,3]){ const b=el('button',{type:'button',textContent:`${m} min turns`,className:m===2?'on':''}); b.onclick=()=>{ st.secs=st.left=m*60; len.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); draw(); }; len.append(b); }

    const done=el('button',{className:'ghost',textContent:'Done',style:'width:100%;margin-top:8px'}); done.onclick=()=>{ clearInterval(st.t); close(); };
    draw(); sh.append(topic,len,who,clock,el('div',{className:'btns'},reset,swap,startB),tips,words,done);
