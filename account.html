<!doctype html>
<html lang="en" data-partners="phone">
<head>
<script>/* Partners moved to ezRAD.com: this old address opens the same screen there. Add ?stay=1 to keep using this old copy (a way back). */(function(){var q=location.search,s=false;try{if(/[?&]stay=1\b/.test(q))sessionStorage.setItem('partners.stay','1');s=sessionStorage.getItem('partners.stay')==='1';}catch(e){}if(s)return;var p=location.pathname.split('/').pop();if(p==='index.html')p='';location.replace('https://ezrad.pages.dev/app/partners/'+p+q+location.hash);})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFE9F1">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" href="icon-512.png">
<title>Partners · Account</title>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{--display:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;--body:"Nunito",ui-rounded,system-ui,sans-serif}
*{box-sizing:border-box} .hidden{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:500 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:12px 16px 48px}
header{display:flex;align-items:center;gap:8px;padding:8px 0 12px}
header a.back{color:var(--accent);font-weight:800;text-decoration:none;font-size:16px;margin-right:auto}
h1{font:600 30px var(--display);margin:4px 0 14px;display:flex;align-items:center;gap:8px}
h2{font:600 20px var(--display);margin:0 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.banner{border-radius:14px;padding:12px 14px;font-weight:800;margin-bottom:14px;background:var(--panel2)}
.banner.good{border-left:5px solid #1B7F51} .banner.warn{border-left:5px solid var(--accent)}
.muted{color:var(--dim);font-size:14px;margin:4px 0}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)} .row:last-child{border:none}
button,.btn{font:800 15px var(--body);border-radius:14px;padding:12px 14px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
button.primary{background:var(--accent);color:#fff;border:none}
button:disabled{opacity:.6}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.plan{position:relative;text-align:center;border:2px solid var(--line);border-radius:16px;padding:16px 10px;background:var(--panel)}
.plan.best{border-color:var(--accent)} .plan .amt{font:600 30px var(--display)} .plan .per{color:var(--dim);font-weight:800;font-size:13px}
.plan button{width:100%;margin-top:10px}
.fhave{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0} .fhave .pill{background:var(--panel2);border-radius:999px;padding:4px 10px;font-weight:800;font-size:14px}
.badge{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;font-weight:800;font-size:11px;padding:3px 10px;border-radius:999px;white-space:nowrap}
.code{font:600 30px var(--display);letter-spacing:.18em;text-align:center;background:var(--panel2);border-radius:14px;padding:10px}
.copyrow{display:flex;gap:8px;margin-top:8px} .copyrow button{flex:1}
input{width:100%;font:700 16px var(--body);padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--inputbg,#fff);color:var(--text);text-transform:uppercase;letter-spacing:.1em}
.stack{display:flex;flex-direction:column;gap:8px}
.err{color:#B3261E;font-weight:800;font-size:14px;min-height:1em;margin-top:6px}
footer{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--dim)} footer a{color:var(--accent);font-weight:800}
@media (max-width:420px){ .plans{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">
  <header><a class="back" href="plan.html#tasks" id="back">‹ Partners</a></header>
  <h1 id="title">Account</h1>
  <div id="banner"></div>
  <div class="card" id="planCard"><h2>Your plan</h2><div id="plan"><p class="muted">Loading…</p></div></div>
  <div class="card" id="coupleCard"><h2>The two of you</h2><div id="couple"></div></div>
  <div class="card" id="googleCard"><h2>Google</h2><div id="google"></div></div>
  <div class="card"><h2>You</h2><div id="me"></div></div>
  <footer><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a><a href="#" id="support" class="hidden">Contact support</a></footer>
</div>
<script src="core-butterfly.js"></script>
<script src="account.js"></script>
<script>
'use strict';
const SUPPORT_EMAIL='';   // set once there's a support address, e.g. partners.help@…
const PRICE={month:'$7.99', year:'$79'};
const $=id=>document.getElementById(id);
const el=(t,p={},...k)=>{ const e=Object.assign(document.createElement(t),p); e.append(...k); return e; };
const day=ms=>new Date(ms).toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'});
$('title').insertAdjacentHTML('afterbegin', butterfly({size:34, flutter:true}));
if(SUPPORT_EMAIL){ $('support').href='mailto:'+SUPPORT_EMAIL; $('support').classList.remove('hidden'); }
if(!acct.session) location.replace('welcome.html');
const q=new URLSearchParams(location.search);
if(q.get('ended')) $('banner').replaceChildren(el('div',{className:'banner warn',textContent:'Your free trial has ended. Choose a plan below to keep using Partners. Everything you added is still here.'}));
if(q.get('paid')) $('banner').replaceChildren(el('div',{className:'banner good',textContent:'Thank you! 💞 Your subscription is being set up. This page updates by itself.'}));

async function checkout(interval, btn){ btn.disabled=true; btn.textContent='Opening checkout…';
  try{ const d=await partnersApi('billing/checkout',{method:'POST',body:JSON.stringify({interval})}); location.href=d.url; }
  catch(e){ btn.disabled=false; btn.textContent='Choose'; alert(e.message); } }
async function portal(btn){ btn.disabled=true;
  try{ const d=await partnersApi('billing/portal',{method:'POST'}); location.href=d.url; }
  catch(e){ btn.disabled=false; alert(e.message); } }
function planChoices(note){
  const box=el('div'); if(note) box.append(el('p',{className:'muted',textContent:note}));
  const plans=el('div',{className:'plans'});
  const mk=(interval,label,amt,per,best)=>{ const b=el('button',{className:'primary',textContent:'Choose'}); b.onclick=()=>checkout(interval,b);
    const p=el('div',{className:'plan'+(best?' best':'')}); if(best) p.append(el('span',{className:'badge',textContent:'2 months free'}));
    p.append(el('div',{className:'per',textContent:label}), el('div',{className:'amt',textContent:amt}), el('div',{className:'per',textContent:per}), b); return p; };
  plans.append(mk('month','Monthly',PRICE.month,'per month'), mk('year','Annual',PRICE.year,'per year · about $6.58/mo',true));
  box.append(plans, el('p',{className:'muted',textContent:'One plan covers both of you on every device. Payments are handled securely by Stripe. Cancel anytime.'}));
  return box;
}
// Partners on ezRAD.com: pay per feature instead of one plan.
async function renderFeatures(c){
  let f; try{ f=await partnersApi('features'); }catch(_){ return false; } if(!f||!f.perFeature) return false;
  try{ localStorage.setItem('partners.features',JSON.stringify({...f,at:Date.now()})); }catch(_){}
  $('planCard').querySelector('h2').textContent='Your features';
  const box=$('plan'), have=(f.list||[]).filter(x=>(f.keys||[]).includes(x.key)), left=Math.max(0,Math.ceil(((f.trialEnds||0)-Date.now())/864e5));
  const lines=[];
  if(c.id==='home'||f.all&&!f.trial) lines.push(el('p',{innerHTML:'<b>Everything is included</b> for you.'}));
  else if(f.trial) lines.push(el('p',{innerHTML:`<b>Free trial</b>: ${left} day${left===1?'':'s'} left. You can use every feature until then; pick the ones to keep.`}));
  else if(!have.length) lines.push(el('p',{innerHTML:'<b>Your free trial has ended.</b> Pick the features you want to keep using. Everything you added is still here.'}));
  if(have.length && !f.trial && !(c.id==='home')) lines.push(el('div',{className:'fhave'},...have.map(x=>el('span',{className:'pill',textContent:`${x.icon||''} ${x.name}`}))));
  const pick=el('button',{className:'primary',textContent:f.trial||!have.length?'Choose features':'Add or remove features',style:'width:100%;margin-top:10px'}); pick.onclick=()=>partnersShop();
  if(c.id!=='home') lines.push(pick);
  if((f.paid||[]).length){ const m=el('button',{textContent:'Billing, receipts and card',style:'width:100%;margin-top:8px'}); m.onclick=()=>portal(m); lines.push(m); }
  lines.push(el('p',{className:'muted',textContent:'Pay only for the features you use; one subscription covers both of you on every device. Payments are handled securely by Stripe.'}));
  box.replaceChildren(...lines); return true;
}
function renderPlan(c){
  const p=c.plan, box=$('plan'), left=Math.max(0,Math.ceil((p.trialEnds-Date.now())/864e5));
  const manage=()=>{ const b=el('button',{textContent:'Manage subscription, card or invoices'}); b.onclick=()=>portal(b); return b; };
  if(c.id==='home' || p.status==='free'){ box.replaceChildren(el('p',{textContent:'Free for the two of you, always. 💞'})); return; }
  if(p.status==='trialing' && !p.hasBilling && p.trialEnds>Date.now()){
    box.replaceChildren(el('p',{innerHTML:`<b>Free trial</b>: ${left} day${left===1?'':'s'} left (until ${day(p.trialEnds)}).`}), planChoices('Pick a plan now or any time before your trial ends. You won’t be charged until the trial is over.')); return; }
  if(p.status==='trialing' && p.trialEnds>Date.now()){
    box.replaceChildren(el('p',{innerHTML:`<b>${p.interval==='year'?'Annual':'Monthly'} plan</b>, free until ${day(p.trialEnds)}. Your first payment is on that day.`}), manage()); return; }
  if(p.status==='active'){
    box.replaceChildren(el('p',{innerHTML:`<b>${p.interval==='year'?'Annual':'Monthly'} plan</b> · ${p.interval==='year'?PRICE.year+' a year':PRICE.month+' a month'}`}),
      el('p',{className:'muted',textContent:p.cancelAtEnd?`Canceled. Partners keeps working until ${day(p.periodEnd)}.`:`Renews on ${day(p.periodEnd)}.`}), manage()); return; }
  if(p.status==='past_due' || p.status==='unpaid'){
    box.replaceChildren(el('p',{className:'banner warn',textContent:'Your last payment didn’t go through. Update your card to keep Partners running.'}), manage()); return; }
  // ended trial, canceled, or never started
  box.replaceChildren(el('p',{textContent:p.status==='canceled'?'Your subscription has ended.':'Your free trial has ended.'}), planChoices(), ...(p.hasBilling?[manage()]:[]));
}
async function renderCouple(c, members){
  const box=$('couple'); box.replaceChildren();
  members.forEach(m=>box.append(el('div',{className:'row'}, el('span',{textContent:m.name||m.email}), el('span',{className:'muted',textContent:m.email}))));
  if(c.id==='home' || c.members.length>=2) return;
  const inv=el('button',{className:'primary',textContent:'💌 Invite my partner'}), out=el('div'), err=el('div',{className:'err'});
  inv.onclick=async()=>{ inv.disabled=true;
    try{ const d=await partnersApi('couple/invite',{method:'POST'});
      const copy=el('button',{textContent:'Copy link'}); copy.onclick=async()=>{ try{ await navigator.clipboard.writeText(d.link); copy.textContent='Copied ✓'; }catch(_){ prompt('Copy this link',d.link); } };
      const share=el('button',{textContent:'Share…'}); share.onclick=()=>navigator.share?navigator.share({title:'Join me on Partners',text:'Join me on Partners! Our plan covers us both.',url:d.link}).catch(()=>{}):copy.click();
      out.replaceChildren(el('p',{className:'muted',textContent:'Send your partner this link, or have them enter the code when they sign up. It works for 7 days.'}), el('div',{className:'code',textContent:d.code}), el('div',{className:'copyrow'},copy,share)); inv.classList.add('hidden'); }
    catch(e){ err.textContent=e.message; inv.disabled=false; } };
  const code=el('input',{placeholder:'Partner’s invite code',maxLength:10,autocapitalize:'characters'}), join=el('button',{textContent:'Join my partner'});
  join.onclick=async()=>{ if(!code.value.trim()) return code.focus(); join.disabled=true;
    try{ await partnersApi('couple/join',{method:'POST',body:JSON.stringify({code:code.value})}); load(); }catch(e){ err.textContent=e.message; join.disabled=false; } };
  box.append(el('p',{className:'muted',textContent:'Partners is for two. Invite your partner; your plan covers you both.'}), el('div',{className:'stack'},inv,out,el('p',{className:'muted',textContent:'Or, if your partner already invited you:'}),code,join,err));
}
function renderGoogle(me){
  const box=$('google');
  if(me.signedIn){ box.replaceChildren(el('p',{className:'muted',textContent:'Connected. Calendar, Tasks import and Google Photos work.'})); return; }
  const b=el('button',{className:'primary',textContent:'Connect Google'}); b.onclick=()=>partnersSignIn('account.html');
  box.replaceChildren(el('p',{className:'muted',textContent:'Connect your Google account to see your Google Calendar, import Google Tasks and pick from Google Photos.'}), b);
}
function renderMe(me){
  const out=el('button',{textContent:'Log out on this device'});
  out.onclick=async()=>{ try{ await partnersApi('auth/signout',{method:'POST'}); }catch(_){} acct.clear(); location.replace('welcome.html'); };
  $('me').replaceChildren(el('div',{className:'row'},el('span',{textContent:me.name||''}),el('span',{className:'muted',textContent:me.email})), el('div',{className:'stack',style:'margin-top:10px'},out));
}
let tries=0;
async function load(){
  try{ const [d,m]=await Promise.all([partnersApi('me'), partnersApi('members')]);
    if(!await renderFeatures(d.couple)) renderPlan(d.couple); renderCouple(d.couple, m.members||[]); renderGoogle(d.me); renderMe(d.me);
    // Just paid: Stripe tells the relay within a few seconds.
    if(q.get('paid') && !['active','trialing'].includes(d.couple.plan.status) && tries++<10) setTimeout(load,3000);
    else if(q.get('paid') && d.couple.plan.hasBilling && tries++<10 && d.couple.plan.status==='trialing' && !d.couple.plan.interval) setTimeout(load,3000);
  }catch(e){ if(e.status===401) location.replace('welcome.html'); else $('plan').replaceChildren(el('p',{className:'err',textContent:e.message})); }
}
load();
</script>
</body>
</html>
